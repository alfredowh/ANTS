<title>ANTS Run Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky experiment rail on the left, one experiment per view: map, then its commands. */
:root{
  --bg:#eef0f3; --panel:#ffffff; --panel2:#f5f6f8; --line:#d5d9e0; --fg:#1b2230; --mute:#5c6678;
  --accent:#0b6e8a; --accent-bg:#d9edf3; --paid:#b4531a; --paid-bg:#fbe6d6; --ok:#2c7a4b; --ok-bg:#dcf0e3;
  --code-bg:#161c28; --code-fg:#e4e9f2; --code-mute:#8e99ad; --node:#ffffff; --node-dim:#e6e9ee; --edge:#a7afbd;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141c; --panel:#171d29; --panel2:#1d2433; --line:#2c3547; --fg:#e3e8f1; --mute:#93a0b6;
  --accent:#5cc3df; --accent-bg:#17394a; --paid:#f0a06a; --paid-bg:#41281a; --ok:#6fcf93; --ok-bg:#183a28;
  --code-bg:#0b0f17; --code-fg:#e4e9f2; --code-mute:#74809a; --node:#1d2433; --node-dim:#151b27; --edge:#47536a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141c; --panel:#171d29; --panel2:#1d2433; --line:#2c3547; --fg:#e3e8f1; --mute:#93a0b6;
  --accent:#5cc3df; --accent-bg:#17394a; --paid:#f0a06a; --paid-bg:#41281a; --ok:#6fcf93; --ok-bg:#183a28;
  --code-bg:#0b0f17; --code-fg:#e4e9f2; --code-mute:#74809a; --node:#1d2433; --node-dim:#151b27; --edge:#47536a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:12.5px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;padding:20px 0 14px}
header.top h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
header.top p{margin:2px 0 0;color:var(--mute);max-width:70ch}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],input[type=text],select{font:inherit;font-family:var(--mono);font-size:12.5px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);max-height:100vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
@media(max-width:860px){nav.rail{position:static;max-height:none}}
nav.rail h2{margin:10px 8px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
nav.rail button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);font:inherit;padding:7px 8px;border-radius:6px;cursor:pointer}
nav.rail button:hover{background:var(--panel2)}
nav.rail button[aria-current=true]{background:var(--accent-bg);color:var(--accent);font-weight:600}
nav.rail small{display:block;color:var(--mute);font-weight:400;font-size:11.5px}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card h2{margin:0 0 6px;font-size:17px;font-weight:600}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill.paid{background:var(--paid-bg);color:var(--paid);border-color:transparent;font-weight:600}
.pill.free{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.st{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.io{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
@media(max-width:700px){.io{grid-template-columns:minmax(0,1fr)}}
.io>div{background:var(--panel2);border-radius:6px;padding:10px;min-width:0}
.io ul{margin:0;padding-left:18px}.io li{margin:2px 0;overflow-wrap:anywhere}
.io .mid{border:1px dashed var(--line);background:none}
.map{overflow-x:auto}
.map svg{display:block;min-width:720px;width:100%;height:auto}
.node rect{fill:var(--node);stroke:var(--line);stroke-width:1}
.node text{fill:var(--fg);font:500 12px var(--sans)}
.node .sub{fill:var(--mute);font:400 10px var(--mono)}
.node.dim{opacity:.38}
.node.hit rect{fill:var(--accent-bg);stroke:var(--accent);stroke-width:1.5}
.node.hit text{fill:var(--accent)}
.node.sel rect{stroke:var(--fg);stroke-width:2}
.node{cursor:pointer}
.edge{stroke:var(--edge);stroke-width:1.2;fill:none}
.edge.hit{stroke:var(--accent);stroke-width:1.6}
.edge.dim{opacity:.25}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:12px;margin-top:6px}
.mod{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.mod dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:4px 12px;margin:8px 0 0}
.mod dt{color:var(--mute)}.mod dd{margin:0;overflow-wrap:anywhere}
.cmd{display:flex;flex-direction:column;gap:10px}
.cmd header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;justify-content:space-between}
.cmd h2{font-size:15px;margin:0}
.cmd .id{font-family:var(--mono);font-size:12px;color:var(--mute)}
.cmd p{margin:0;color:var(--fg);max-width:90ch}
.args{display:grid;grid-template-columns:auto minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,2.4fr);gap:4px 10px;align-items:center;font-size:12.5px}
.args .h{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.args .flag{font-family:var(--mono);overflow-wrap:anywhere}
.args .desc{color:var(--mute);overflow-wrap:anywhere}
.args input[type=text],.args select{width:100%}
.argwrap{overflow-x:auto}
@media(max-width:700px){.args{grid-template-columns:auto minmax(0,1fr)}.args .h{display:none}.args .desc{grid-column:1/-1;margin-bottom:6px}.args .val{grid-column:1/-1}}
.term{position:relative;background:var(--code-bg);border-radius:6px}
.term pre{margin:0;padding:12px 84px 12px 14px;color:var(--code-fg);font:12.5px/1.55 var(--mono);overflow-x:auto;white-space:pre}
.btn{font:inherit;font-size:12px;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:4px 10px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.copy{position:absolute;top:8px;right:8px;background:#26304a;border-color:#3a4766;color:#dbe4f5}
.copy:hover{background:#2f3b5c;color:#fff;border-color:#5c6e99}
.copy.done{background:#245c3d;border-color:#2f7a50;color:#fff}
.ex summary{cursor:pointer;color:var(--accent);font-size:12.5px}
.ex .term{margin-top:8px}.ex .cap{margin:10px 0 0;font-size:12.5px;color:var(--mute)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mute);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--panel2);color:var(--mute);border-radius:4px;padding:1px 6px;cursor:pointer}
.chip:hover{color:var(--accent);border-color:var(--accent)}
.note{font-size:12.5px;color:var(--mute)}
.warn{background:var(--paid-bg);color:var(--paid);border-radius:6px;padding:8px 10px;font-size:12.5px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>ANTS Run Book</h1>
      <p id="sub"></p>
    </div>
    <div class="tools">
      <input type="search" id="q" style="width:220px" placeholder="Search commands, flags" aria-label="Search commands and flags">
      <a id="arch" href="#" target="_blank" rel="noopener">Architecture diagram</a>
    </div>
  </header>
  <div class="grid">
    <nav class="rail" id="rail" aria-label="Experiments"></nav>
    <main id="main"></main>
  </div>
</div>

<script type="application/json" id="data">/*DATA*/</script>
<script>
(function(){
const D=JSON.parse(document.getElementById("data").textContent);
const EXP=Object.fromEntries(D.experiments.map(e=>[e.id,e]));
const MOD=Object.fromEntries(D.modules.map(m=>[m.id,m]));
const CMD=Object.fromEntries(D.commands.map(c=>[c.id,c]));
const state={}; // command id -> {on:{flag:bool}, val:{flag:string}}
let sel=null, selMod=null;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function href(p){
  if(!p||p.startsWith("..")) return null;
  if(/^https?:/.test(p)) return p;
  p=p.split(",")[0].trim();
  return location.protocol==="file:" ? "../"+p : D.repo_url+p;
}
const link=p=>{const h=href(p);return h?`<a href="${esc(h)}" target="_blank" rel="noopener">${esc(p)}</a>`:`<span class="mono">${esc(p)}</span>`};

// Same rules as ants.evalkit.runbook.command_text.
const SAFE=/^[A-Za-z0-9_@%+=:,.\/-]+$/;
const q=(v,raw)=>raw||SAFE.test(v)?v:"'"+v.replace(/'/g,"'\\''")+"'";
function st(c){return state[c.id]||(state[c.id]={on:Object.fromEntries(c.args.map(a=>[a.flag,a.on])),val:Object.fromEntries(c.args.map(a=>[a.flag,a.value||""]))})}
function text(c){
  const s=st(c),head=[],env=[],fl=[];
  if(c.where)head.push(c.where);
  if(c.env)env.push(c.env);
  for(const a of c.args){
    if(!s.on[a.flag])continue;
    const v=s.val[a.flag];
    if(a.kind==="env")env.push(a.flag+q(v));
    else if(a.kind==="switch")fl.push(a.flag);
    else fl.push(a.flag+" "+q(v,a.raw));
  }
  const main=[...env,D.runners[c.runner].prefix,c.base].filter(Boolean).join(" ");
  const body=[main,...fl].join(" \\\n    ");
  return head.length?[...head,body].join(" && "):body;
}

async function copy(btn,t){
  try{await navigator.clipboard.writeText(t);}
  catch{const r=document.createRange(),pre=btn.parentElement.querySelector("pre");r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);}
  const old=btn.textContent;btn.textContent="Copied";btn.classList.add("done");
  setTimeout(()=>{btn.textContent=old;btn.classList.remove("done")},1400);
}
const term=(t,id)=>`<div class="term"><pre${id?` id="${id}"`:""}>${esc(t)}</pre><button class="btn copy" type="button" data-copy="${id||""}">Copy</button></div>`;

/* ---------- architecture map ---------- */
const POS={hurobo:[0,0],demospec_tools:[1,0],generator:[2,0],llm:[3,0],muse:[4,0],
 libero_demos:[0,1],orch_exp:[1,1],diagnoser:[3,1],scene_world:[4,1],
 planner:[0,2],system2:[1,2],rollout:[2,2],launcher:[3,2],aspire:[4,2],
 evalkit:[1,3],contracts:[2,3],curobo_dev:[3,3],services:[4,3],radar:[0,3]};
const NW=168,NH=46,CX=196,RY=84;
const pos=id=>({x:10+POS[id][0]*CX,y:10+POS[id][1]*RY});
function map(e){
  const hit=new Set(e.modules);
  let s=`<svg viewBox="0 0 ${10+4*CX+NW+10} ${10+3*RY+NH+10}" role="img" aria-label="Module map; highlighted modules are used by this experiment"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--edge)"/></marker></defs>`;
  for(const [a,b] of D.flow){
    const pa=pos(a),pb=pos(b),on=hit.has(a)&&hit.has(b);
    s+=`<line class="edge ${on?"hit":hit.size?"dim":""}" x1="${pa.x+NW/2}" y1="${pa.y+NH/2}" x2="${pb.x+NW/2}" y2="${pb.y+NH/2}" marker-end="url(#ar)"/>`;
  }
  for(const m of D.modules){
    if(!POS[m.id])continue;const p=pos(m.id),on=hit.has(m.id);
    s+=`<g class="node ${on?"hit":hit.size?"dim":""} ${selMod===m.id?"sel":""}" data-mod="${m.id}" tabindex="0" role="button" aria-label="${esc(m.name)}"><rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="6"/><text x="${p.x+10}" y="${p.y+19}">${esc(m.name.length>27?m.name.slice(0,26)+"…":m.name)}</text><text class="sub" x="${p.x+10}" y="${p.y+35}">${esc(m.group)}</text></g>`;
  }
  return s+"</svg>";
}
function modPanel(){
  if(!selMod)return `<p class="note">Select a module to see its job, files, input and output. Highlighted modules are the ones this experiment touches.</p>`;
  const m=MOD[selMod];
  const users=D.experiments.filter(e=>e.modules.includes(m.id)).map(e=>`<button class="chip" data-exp="${e.id}">${esc(e.id)}</button>`).join("");
  return `<div class="mod"><strong>${esc(m.name)}</strong> <span class="pill">${esc(m.group)}</span>
   <dl><dt>Does</dt><dd>${esc(m.role)}</dd><dt>Files</dt><dd>${m.path.split(", ").map(link).join(", ")}</dd>
   <dt>Input</dt><dd>${esc(m.in.join("; ")||"none")}</dd><dt>Output</dt><dd>${esc(m.out.join("; ")||"none")}</dd>
   <dt>Doc</dt><dd>${link(m.doc)}</dd><dt>Used by</dt><dd><span class="chips">${users}</span></dd></dl></div>`;
}

/* ---------- commands ---------- */
function argRow(c,a,i){
  const s=st(c),id=`${c.id}-${i}`;
  const ck=`<input type="checkbox" id="${id}-on" data-cmd="${c.id}" data-flag="${esc(a.flag)}" ${s.on[a.flag]?"checked":""} ${a.required?"disabled checked":""} aria-label="Use ${esc(a.flag)}">`;
  let val="";
  if(a.kind!=="switch"){
    val=a.choices?`<select class="val" id="${id}-v" data-cmd="${c.id}" data-flag="${esc(a.flag)}">${[...new Set([a.value,...a.choices])].map(o=>`<option ${o===s.val[a.flag]?"selected":""}>${esc(o)}</option>`).join("")}</select>`
      :`<input class="val" type="text" id="${id}-v" data-cmd="${c.id}" data-flag="${esc(a.flag)}" value="${esc(s.val[a.flag])}" spellcheck="false">`;
  }else val=`<span class="note">switch</span>`;
  return `${ck}<label class="flag" for="${id}-on">${esc(a.flag)}${a.required?" *":""}</label><div>${val}</div><div class="desc">${esc(a.desc)}</div>`;
}
function cmdCard(c){
  const r=D.runners[c.runner];
  const ex=c.examples.length?`<details class="ex"><summary>${c.examples.length} example${c.examples.length>1?"s":""}</summary>${c.examples.map((x,i)=>`<p class="cap">${esc(x.title)}</p>${term(x.cmd,`ex-${c.id}-${i}`)}`).join("")}</details>`:"";
  const mods=c.modules.length?`<span class="chips">${c.modules.map(m=>`<button class="chip" data-mod="${m}">${esc(m)}</button>`).join("")}</span>`:"";
  return `<section class="card cmd" id="c-${c.id}" data-cmd="${c.id}">
   <header><div><h2>${esc(c.title)}</h2><span class="id">${esc(c.id)}</span></div>
   <div class="row">${c.paid?`<span class="pill paid">spends Muse tokens</span>`:`<span class="pill free">${esc(c.cost||"free")}</span>`}<span class="pill">~${c.minutes} min</span><span class="pill">${esc(r.label)}</span></div></header>
   <p>${esc(c.description)}</p>
   ${c.paid?`<div class="warn">Paid: ${esc(c.cost||"")}. Keep <code>--token-budget</code> small first, and ask before a big run.</div>`:""}
   ${c.args.length?`<div class="argwrap"><div class="args"><span class="h"></span><span class="h">Flag</span><span class="h">Value</span><span class="h">Meaning</span>${c.args.map((a,i)=>argRow(c,a,i)).join("")}</div></div>`:""}
   ${term(text(c),`out-${c.id}`)}
   ${ex}
   <div class="meta"><span>Reads: ${esc(c.in.join("; ")||"nothing")}</span><span>Writes: ${esc(c.out.join("; ")||"nothing")}</span>${c.doc?`<span>Doc: ${link(c.doc)}</span>`:""}</div>
   ${mods}</section>`;
}

/* ---------- views ---------- */
function rail(){
  const kinds=[["setup","Setup and prep"],["experiment","Experiments"],["tool","Tools"]];
  const k=e=>e.kind==="prep"?"setup":e.kind;
  let h=`<h2>Overview</h2><button data-exp="all" aria-current="${sel==="all"}">All commands<small>${D.commands.length} commands, grouped</small></button>`;
  for(const [key,label] of kinds){
    h+=`<h2>${label}</h2>`+D.experiments.filter(e=>k(e)===key).map(e=>`<button data-exp="${e.id}" aria-current="${sel===e.id}">${esc(e.title)}<small>${esc(e.status)}</small></button>`).join("");
  }
  $("#rail").innerHTML=h;
}
function expView(e){
  return `<section class="card"><div class="row" style="justify-content:space-between"><h2>${esc(e.title)}</h2><span class="pill st">${esc(e.status)}</span></div>
   <p style="margin:4px 0 10px">${esc(e.question)}</p>
   <div class="meta"><span>Docs: ${link(e.doc)}</span>${e.run_dir?`<span>Run dir: <code>${esc(e.run_dir)}</code></span>`:""}${e.cost?`<span>Cost: ${esc(e.cost)}</span>`:""}</div>
   <p class="note" style="margin:8px 0 0"><strong>Result so far:</strong> ${esc(e.result)}</p></section>
   <section class="card"><h3>Input, what runs, output</h3><div class="io">
    <div><strong>Input</strong><ul>${e.inputs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="mid"><strong>Commands, in order</strong><ul>${e.commands.map(c=>`<li><a href="#c-${c}" data-jump="${c}">${esc(CMD[c].title)}</a></li>`).join("")}</ul></div>
    <div><strong>Output</strong><ul>${e.outputs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div></section>
   <section class="card"><h3>Where it sits in the architecture</h3><div class="map" id="map">${map(e)}</div>
    <div class="legend"><span>Highlighted: used by this experiment</span><span>Arrows: data flow</span><span>Click a module</span></div>
    <div id="modpanel">${modPanel()}</div></section>
   ${e.commands.map(c=>cmdCard(CMD[c])).join("")}`;
}
function allView(filter){
  const f=filter.toLowerCase();
  const hits=D.commands.filter(c=>!f||[c.id,c.title,c.description,...c.args.map(a=>a.flag+" "+a.desc)].join(" ").toLowerCase().includes(f));
  const groups=[...new Set(hits.map(c=>c.group))];
  return `<section class="card"><h2>${f?`Commands matching “${esc(filter)}”`:"All commands"}</h2><p class="note" style="margin:0">${hits.length} of ${D.commands.length}. Pick an experiment on the left for the map and the commands in order.</p></section>`+
    (groups.map(g=>`<h3 style="margin:8px 0 0;color:var(--mute);font-size:12px;letter-spacing:.07em;text-transform:uppercase">${esc(g)}</h3>`+hits.filter(c=>c.group===g).map(cmdCard).join("")).join("")||`<section class="card">No command matches.</section>`);
}
function render(keepScroll){
  const y=scrollY;
  rail();
  $("#main").innerHTML=sel==="all"||!EXP[sel]?allView($("#q").value):expView(EXP[sel]);
  if(keepScroll)scrollTo(0,y);
}
function go(id){sel=id;selMod=null;try{history.replaceState(null,"","#"+id)}catch{location.hash=id}render();scrollTo(0,0)}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("button,a,.node");if(!t)return;
  if(t.dataset.exp){go(t.dataset.exp);return}
  if(t.dataset.mod&&t.closest("#map,.chips")){selMod=t.dataset.mod;if(sel==="all"){go(D.experiments.find(e=>e.modules.includes(selMod)).id);selMod=t.dataset.mod}
    const e=EXP[sel];$("#map").innerHTML=map(e);$("#modpanel").innerHTML=modPanel();$("#modpanel").scrollIntoView({block:"nearest"});return}
  if(t.dataset.jump){ev.preventDefault();$("#c-"+t.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(t.classList.contains("copy")){const pre=t.parentElement.querySelector("pre");copy(t,pre.textContent);}
});
document.addEventListener("keydown",ev=>{const n=ev.target.closest&&ev.target.closest(".node");if(n&&(ev.key==="Enter"||ev.key===" ")){ev.preventDefault();n.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
function upd(ev){
  const t=ev.target;if(!t.dataset||!t.dataset.cmd)return;
  const c=CMD[t.dataset.cmd],s=st(c),f=t.dataset.flag;

  else{s.val[f]=t.value;s.on[f]=true;const cb=t.closest(".args").querySelector(`input[type=checkbox][data-flag="${CSS.escape(f)}"]`);if(cb)cb.checked=true}
  $("#out-"+c.id).textContent=text(c);
}
