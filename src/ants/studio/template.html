<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANTS Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Dark studio look from the ANTS Observability design (Harden, Replay). Single theme by intent. */
:root{
  --bg:#000000; --panel:#0A0A0A; --raise:#111111; --line:#262626; --line2:#1F1F1F;
  --fg:#EDEDED; --hi:#FFFFFF; --soft:#B5B5B5; --muted:#8A8A8A; --dim:#6E6E6E; --faint:#3D3D3D;
  --accent:#F59342; --fail:#FF4D4D; --pass:#3D3D3D; --meta:#7AA7FF;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:13px/1.45 var(--sans)}
a{color:var(--fg)} a:hover{color:var(--hi)}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:square;flex:none}
header{display:flex;flex-wrap:wrap;align-items:center;gap:24px;min-height:52px;border-bottom:1px solid var(--line);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted)}
nav{display:flex;align-self:stretch}
.tab{display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;min-height:44px}
.tab[aria-current="page"]{color:var(--hi);border-bottom-color:var(--hi);font-weight:500}
.cols{display:flex;flex-wrap:wrap;align-items:stretch}
.left{flex:1 1 260px;max-width:300px;border-right:1px solid var(--line);padding:16px 0}
.main{flex:999 1 620px;min-width:0;padding:20px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line)}
.right{flex:1 1 360px;min-width:0;max-width:420px;padding:20px 16px;display:flex;flex-direction:column;gap:22px}
.pad{padding:0 16px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;color:var(--soft)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.tile{background:var(--panel);padding:14px 16px}
.tile .l{font-size:12px;color:var(--muted)} .tile .v{font-family:var(--mono);font-size:22px}
.strip{display:flex;gap:2px;height:36px}
.strip a{flex:1;min-width:3px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:20px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;display:inline-block}
.tblwrap{overflow-x:auto}
table.log{width:100%;border-collapse:collapse;min-width:640px}
.log th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:8px 14px 8px 0;border-bottom:1px solid var(--line)}
.log td{padding:9px 14px 9px 0;border-bottom:1px solid #1A1A1A;vertical-align:middle}
.log tr.row{cursor:pointer} .log tr.row:hover{background:var(--raise)}
.bars{display:grid;grid-template-columns:72px minmax(0,1fr) 64px;gap:10px;align-items:center;color:var(--soft)}
.track{position:relative;height:4px;background:var(--line2)}
.track b{position:absolute;left:0;top:0;height:4px;background:var(--dim)}
.track i{position:absolute;top:-5px;width:1px;height:14px;background:var(--fg)}
.list a{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center;padding:7px 16px;color:var(--muted);text-decoration:none;border-left:2px solid transparent}
.list a:hover{background:var(--raise)} .list a.on{background:var(--raise);color:var(--fg);border-left-color:var(--fail)}
.list a.on.pass{border-left-color:var(--fg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.grid2>div{background:var(--panel);padding:12px}
.grid2 .l{font-size:11.5px;color:var(--muted)}
.code{background:var(--panel);border:1px solid var(--line);padding:8px 0;font:12px/1.85 var(--mono);overflow-x:auto;max-height:340px;overflow-y:auto}
.code div{white-space:pre;padding:0 12px;color:var(--dim)}
.code div.hl{background:var(--line2);color:var(--hi);border-left:2px solid var(--fail);padding-left:10px}
.code div.add{background:#161616;color:var(--hi)}
.code div.del{background:#1A0E0E;color:#C98585}
.code div.hunk{color:var(--meta)}
.badge.ok{border-color:var(--fg);color:var(--hi)}
.banner{border:1px solid var(--accent);background:#14110D;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.code .n{color:var(--faint);display:inline-block;width:3.2em}
.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.agent{background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.agent.chosen{background:#14110D;box-shadow:inset 0 0 0 1px var(--accent)}
.badge{font:500 10.5px/1 var(--mono);padding:3px 6px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;width:fit-content}
.badge.acc{border-color:var(--accent);color:var(--accent)} .badge.meta{border-color:var(--meta);color:var(--meta)} .badge.fail{border-color:var(--fail);color:var(--fail)}
.tl{border:1px solid var(--line);background:var(--panel)}
.vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.vid{background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.vid video{width:100%;background:#000;display:block}
.player{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);background:var(--panel)}
.player button{background:var(--accent);color:#000;border:0;min-width:40px;height:28px;font:600 12px var(--mono);cursor:pointer}
.player input[type=range]{flex:1;min-width:80px;accent-color:var(--accent);cursor:pointer}
.player select{background:var(--panel);color:var(--fg);border:1px solid var(--line);font:12px var(--mono);padding:3px 4px}
.playhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--hi);pointer-events:none;z-index:3;box-shadow:0 0 0 1px #000}
.tlarea.seek{cursor:col-resize}
.tlhead{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11.5px}
.tlbody{display:grid;grid-template-columns:92px minmax(0,1fr)}
.tlnames>div{display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line2);font-size:11.5px;color:var(--muted)}
.tlarea{position:relative;border-left:1px solid var(--line);overflow:hidden}
.lane{position:relative;border-bottom:1px solid var(--line2)}
.ph{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding-left:8px;font-size:11.5px;font-weight:500;color:#0A0A0A;overflow:hidden;white-space:nowrap;border-right:1px solid #000}
.dm{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;transform:rotate(45deg);background:var(--muted)}
.dm.f{background:var(--fail)}
.flag{position:absolute;top:0;bottom:0;width:1px}
.flag span{position:absolute;top:6px;left:1px;font:500 10.5px/1 var(--mono);padding:2px 5px;color:#000;white-space:nowrap}
.note{color:var(--muted);font-size:12px}
.empty{color:var(--dim);font-size:12.5px;border:1px dashed var(--line);padding:14px}
p{margin:0}
h1{margin:0;font-size:17px;font-weight:500}
@media (max-width:700px){.left,.right{max-width:none;border-right:0}.main{border-right:0}}
@media (prefers-reduced-motion:no-preference){.agent,.list a,.log tr{transition:background .12s}}
</style>
</head>
<body>
<header>
  <svg width="42" height="24" viewBox="0 0 14 8" shape-rendering="crispEdges" role="img" aria-label="ANTS" style="fill:#EDEDED;display:block"><path d="M12 0h.86v.86H12zM11 1h.86v.86H11zM1 2h.86v.86H1zM2 2h.86v.86H2zM3 2h.86v.86H3zM10 2h.86v.86H10zM11 2h.86v.86H11zM12 2h.86v.86H12zM0 3h.86v.86H0zM1 3h.86v.86H1zM2 3h.86v.86H2zM3 3h.86v.86H3zM4 3h.86v.86H4zM6 3h.86v.86H6zM7 3h.86v.86H7zM8 3h.86v.86H8zM10 3h.86v.86H10zM11 3h.86v.86H11zM12 3h.86v.86H12zM13 3h.86v.86H13zM0 4h.86v.86H0zM1 4h.86v.86H1zM2 4h.86v.86H2zM3 4h.86v.86H3zM4 4h.86v.86H4zM6 4h.86v.86H6zM7 4h.86v.86H7zM8 4h.86v.86H8zM10 4h.86v.86H10zM11 4h.86v.86H11zM12 4h.86v.86H12zM1 5h.86v.86H1zM2 5h.86v.86H2zM3 5h.86v.86H3zM5 5h.86v.86H5zM7 5h.86v.86H7zM9 5h.86v.86H9zM4 6h.86v.86H4zM7 6h.86v.86H7zM10 6h.86v.86H10zM3 7h.86v.86H3zM7 7h.86v.86H7zM11 7h.86v.86H11z"/></svg>
  <div class="crumb"><span>antagon</span><span aria-hidden="true">/</span><span id="skill">bowl-on-plate</span><span aria-hidden="true">/</span><span class="mono" id="runname" style="color:var(--fg)"></span></div>
  <nav aria-label="Sections">
    <a class="tab" href="#harden" id="tab-harden"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3"/><polyline points="18,3 18,7 14,7"/><path d="M20 12a8 8 0 0 1-14 5.3"/><polyline points="6,21 6,17 10,17"/></svg>Harden</a>
    <a class="tab" href="#replay" id="tab-replay"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14"/><path d="M3 9h18M3 15h18M8 5v4M16 5v4M8 15v4M16 15v4"/></svg>Replay</a>
    <a class="tab" href="#versions" id="tab-versions" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 8v8M8 6c6 0 8 2 8 4M8 18c6 0 8-2 8-4"/></svg>Versions</a>
  </nav>
  <div style="flex:1"></div>
  <span class="mono" id="counter" style="color:var(--muted)"></span>
</header>
<div id="app"></div>

<script>
const D = /*__DATA__*/null;
const A = D.attacks, R = D.run, C = R.config;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fx = (v, d=2) => (v === null || v === undefined || Number.isNaN(+v)) ? "–" : (+v).toFixed(d);
const failed = a => a.outcome === "failure";
const UNITS = {dx_m:["dx","cm",100], dy_m:["dy","cm",100], friction_scale:["friction ×","",1], mass_scale:["mass ×","",1],
  bowl_scale:["bowl ×","",1], plate_scale:["plate ×","",1], noise_std:["noise σ","cm",100], latency_steps:["latency","steps",1],
  fovy_delta_deg:["fov","°",1], diffuse_scale:["light ×","",1]};
function params(p){
  return Object.entries(p||{}).map(([k,v]) => { const u = UNITS[k] || [k,"",1]; const x = v*u[2];
    const s = (u[0].endsWith("×") ? "" : (x>0?"+":"")) + (Number.isInteger(x) ? String(x) : Math.abs(x) >= 10 ? x.toFixed(1) : x.toFixed(2));
    return u[0].endsWith("×") ? u[0] + s : `${u[0]} ${s}${u[1] ? " "+u[1] : ""}`; }).join(" · ");
}
const modelName = () => R.model === "muse-spark" ? "Muse Spark" : "rules only";
const L = D.loop;  /* null for a System 2 run, set for a closed-loop run */
const progOf = v => { const x = L && L.versions.find(q => q.version === v); return x ? x.code : D.program; };
const finalV = () => L ? (L.final_version ?? R.policy.version) : R.policy.version;
const DEC = {accepted:["accepted","ok"], rejected:["rejected by gate","fail"], budget_stop:["budget stop",""]};
const decBadge = d => d && DEC[d] ? `<span class="badge ${DEC[d][1]}">${DEC[d][0]}</span>` : "";
function diffBlock(diff){
  if (!diff) return '<div class="empty">The candidate did not change the code.</div>';
  return `<div class="code">${diff.split("\n").filter(t => t && !t.startsWith("---") && !t.startsWith("+++")).map(t =>
    `<div class="${t.startsWith("@@") ? "hunk" : t.startsWith("+") ? "add" : t.startsWith("-") ? "del" : ""}">${esc(t)}</div>`).join("")}</div>`;
}
function gateBlock(g){
  if (!g) return "";
  const list = (ids, label, color) => ids && ids.length ? `<div><span class="l">${label}</span> ${ids.map(i => `<a href="#a-${esc(i)}" class="mono" style="color:${color}">${esc(i)}</a>`).join(" ")}</div>` : "";
  return `<div class="grid2">
    <div><div class="l">Verdict</div><div style="color:${g.accepted ? "var(--hi)" : "var(--fail)"}">${g.accepted ? "accepted" : "rejected"}</div></div>
    <div><div class="l">Rule</div><div class="mono">${esc(g.mode)}</div></div>
    <div><div class="l">Cases replayed</div><div class="mono">${g.cases}</div></div>
    <div><div class="l">Passes incumbent → candidate</div><div class="mono">${g.incumbent_passes} → ${g.candidate_passes}</div></div>
  </div><p style="color:var(--soft)">${esc(g.reason)}</p>${list(g.improvements, "fixed", "var(--hi)")}${list(g.regressions, "broke", "var(--fail)")}`;
}
const isModel = s => s === "model";

/* ---------------- Harden ---------------- */
function harden(){
  const fails = A.filter(failed), sigs = [...new Set(fails.map(a => a.signature))];
  const st = D.status || {}, counts = st.counts || {}, upper = st.upper || {};
  let clean = 0; for (let i = A.length-1; i >= 0 && !failed(A[i]); i--) clean++;
  const cells = Array.from({length: Math.max(R.attacks_planned, A.length)}, (_, i) => {
    const a = A[i];
    if (!a) return `<a aria-label="attack ${i+1} not run" style="border:1px solid var(--line)"></a>`;
    const bg = failed(a) ? "var(--fail)" : a.outcome === "error" ? "var(--accent)" : "var(--pass)";
    return `<a href="#a-${a.id}" title="attack ${a.n} · ${esc(a.category)} · ${a.outcome}" style="background:${bg}"></a>`; }).join("");
  const rows = [...A].reverse().map(a => `<tr class="row" onclick="location.hash='a-${a.id}'">
    <td class="mono">${a.n}</td><td class="mono">v${a.version}</td><td>${esc(a.category)}</td>
    <td class="mono" style="color:var(--muted)">${esc(params(a.params))}</td><td class="mono">${fx(a.severity)}</td>
    <td style="color:${failed(a)?"var(--fail)":"var(--fg)"}">${failed(a)?"failed":a.outcome==="error"?"program error":"passed"}</td>
    <td style="color:var(--dim)">${failed(a) ? `<a href="#a-${a.id}">${esc(a.mode)} · ${esc(a.signature)}</a>` : "—"}</td>
    <td>${a.proposal.source==="model" ? '<span class="badge meta">Muse Spark</span>' : `<span class="badge">${(a.proposal.source||"").startsWith("fallback") ? "fallback" : "sampler"}</span>`}</td>
    ${L ? `<td>${decBadge(a.loop && a.loop.decision)}${a.loop && a.loop.candidate_version != null ? ` <span class="mono note">v${a.loop.candidate_version}</span>` : ""}</td>` : ""}</tr>`).join("");
  const cert = C.categories.map(c => { const [f, s] = counts[c] || [0,0]; const u = upper[c] ?? 1;
    return `<span style="${f?"color:var(--hi)":""}">${esc(c)}</span>
      <div class="track" title="95% upper bound ${fx(u)}"><b style="width:${Math.min(100,u/0.3*100)}%;${f?"background:var(--fail)":""}"></b><i style="left:${0.1/0.3*100}%"></i></div>
      <span class="mono" style="text-align:right">${f ? f+" fail" : s+"/28"}</span>`; }).join("");
  const u = D.usage;
  return `<div class="cols">
  <aside class="left">
    <div class="pad" style="display:flex;flex-direction:column;gap:14px">
      <div><div class="h">Hardening run</div><p class="note" style="margin-top:4px">${L ? "Closed loop: System 2 attacks, System 1 rewrites, the regression gate keeps a rewrite only if it is no worse on every case found so far." + (R.config.synthesizer === "patch fixture" ? " System 1 is the patch fixture here: this shows the loop logic, not robustness." : "") : "System 2 attacks the skill and explains every failure. Rewrites and the regression gate join when System 1 is connected."}</p></div>
      <div class="kv">
        <span>Skill</span><span class="mono">bowl-on-plate · v${finalV()}</span>
        ${L ? `<span>Regression gate</span><span class="mono">${esc(R.config.gate_mode)}</span><span>Escalate after</span><span class="mono">${esc(R.config.stall_window)} stalls</span><span>System 1</span><span>${esc(R.config.synthesizer)}</span>` : ""}
        <span>Attacks</span><span class="mono">${A.length} / ${R.attacks_planned}</span>
        <span>Reasoning model</span><span>${modelName()}</span>
        <span>Parallel attackers</span><span class="mono">${C.n_agents || "—"}</span>
        <span>Max severity</span><span class="mono">${fx(C.severity_bound)}</span>
        <span>Exploration η</span><span class="mono">${fx(C.eta)}</span>
        <span>Stop rule</span><span class="mono">${esc(C.stop_mode)}</span>
        <span>Simulator</span><span>${R.backend === "mock" ? "mock world (test fixture)" : esc(R.backend)}</span>
      </div>
      <fieldset style="border:0;margin:0;padding:0"><legend class="h" style="padding:0 0 6px">Attack categories</legend>
        ${C.categories.map(c => `<div style="padding:3px 0">${esc(c)}</div>`).join("")}</fieldset>
    </div>
  </aside>
  <main class="main">
    <div><h1>Run ${esc(R.name)} · hardening bowl-on-plate</h1>
      <span style="color:var(--muted)">Started ${esc((R.started||"").replace("T"," "))}${R.finished ? " · finished "+esc(R.finished.slice(11)) : ""}${R.backend==="mock" ? " · mock world: a test fixture, not robot results" : ""}</span></div>
    ${L ? loopBanner() : ""}
    <section style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between"><span class="h">Attacks</span><span class="mono" style="color:var(--muted)">${A.length} / ${R.attacks_planned}</span></div>
      <div class="strip">${cells}</div>
      <div class="legend"><span><i class="sw" style="background:var(--pass)"></i>passed</span><span><i class="sw" style="background:var(--fail)"></i>failed</span><span><i class="sw" style="background:var(--accent)"></i>program error</span><span><i class="sw" style="border:1px solid var(--line)"></i>remaining budget</span></div>
    </section>
    <section class="tiles">
      <div class="tile"><div class="l">Program</div><div class="v">v${finalV()}</div></div>
      ${L ? `<div class="tile"><div class="l">Rewrites accepted</div><div class="v">${L.accepted_versions.length}</div></div>
      <div class="tile"><div class="l">Rejected by the gate</div><div class="v">${L.decisions.filter(d => d.decision === "rejected").length}</div></div>` : ""}
      <div class="tile"><div class="l">Failures found</div><div class="v">${fails.length}</div></div>
      <div class="tile"><div class="l">Distinct weaknesses</div><div class="v">${sigs.length}</div></div>
      <div class="tile"><div class="l">Clean since last failure</div><div class="v">${clean}</div></div>
    </section>
    <section style="display:flex;flex-direction:column;gap:10px"><span class="h">Attack log</span>
      <div class="tblwrap"><table class="log"><thead><tr><th>#</th><th>Program</th><th>Category</th><th>Perturbation</th><th>Severity</th><th>Result</th><th>Diagnosis</th><th>Chosen by</th>${L ? "<th>Rewrite</th>" : ""}</tr></thead><tbody>${rows}</tbody></table></div>
    </section>
  </main>
  <aside class="right">
    <section style="display:flex;flex-direction:column;gap:12px"><div class="h">Certification</div>
      <p style="color:var(--soft)">Certified when every category's 95% upper bound on the failure rate is below 0.10: about 28 clean attacks in a row per category.</p>
      <div class="bars">${cert}</div>
      <span class="note">bar = 95% upper bound, 0 to 0.30 · tick = 0.10</span>
    </section>
    <section style="display:flex;flex-direction:column;gap:10px;padding-top:18px;border-top:1px solid var(--line2)"><div class="h">Weaknesses found</div>
      ${sigs.length ? sigs.map(s => { const first = fails.find(a => a.signature === s); const n = fails.filter(a => a.signature === s).length;
        return `<a href="#a-${first.id}" style="display:flex;justify-content:space-between;gap:10px;text-decoration:none;color:var(--soft)"><span class="mono" style="overflow-wrap:anywhere">${esc(s)}</span><span class="mono" style="color:var(--muted)">×${n}</span></a>`; }).join("") : '<span class="note">none yet</span>'}

function loopBanner(){

  const e = L.escalation;

}

/* ---------------- Replay (one attack) ---------------- */
const PHASE = {Setup:"#3D3D3D", Locate:"#6E6E6E", Approach:"#C2611F", Grasp:"#F59342", Transport:"#A9541A", Place:"#8E4616", Retreat:"#5A3A1E"};
/* x-axis of the call timeline. Calls that log controller steps (move_to_pose) get width in
   proportion to them, so the axis approximates episode time and the video playhead can ride on
   it; calls without steps get a small fixed share. Without any steps it is one slot per call. */
function geom(a){
  const n = Math.max(a.calls.length, 1), st = a.calls.map(c => +c.steps || 0), has = st.some(v => v > 0);
  const pos = st.filter(v => v > 0).sort((p, q) => p - q), med = pos.length ? pos[Math.floor(pos.length / 2)] : 1;
  const w = a.calls.length ? st.map(v => has ? (v > 0 ? v : Math.max(4, med * 0.25)) : 1) : [1];
  const tot = w.reduce((p, q) => p + q, 0), b = [0];
  w.forEach(v => b.push(b[b.length - 1] + v / tot));
  const at = f => { if (f >= n) return 1; const k = Math.max(0, Math.floor(f)); return b[k] + (f - k) * (b[k + 1] - b[k]); };
  return {n, has, at, mid: i => at(i + 0.5)};
}
function timeline(a){
  const G = geom(a), n = G.n, x = i => (G.mid(i) * 100).toFixed(2) + "%";
  const spans = []; a.calls.forEach((c, i) => { const last = spans[spans.length-1];
    if (last && last.p === c.phase) last.e = i; else spans.push({p: c.phase, s: i, e: i}); });
  const phases = spans.map(s => `<div class="ph" style="left:${G.at(s.s)*100}%;width:${(G.at(s.e+1)-G.at(s.s))*100}%;background:${PHASE[s.p]||"#555"}" title="${s.p}">${s.p}</div>`).join("");
  const dms = a.calls.map((c, i) => `<span class="dm${c.ok?"":" f"}" style="left:${x(i)}" title="#${i+1} ${esc(c.tool)}${c.query?" ("+esc(c.query)+")":""} · ${esc(c.status)}${c.error_m!=null?" · off by "+fx(c.error_m*100,1)+" cm":""}"></span>`).join("");
  const evs = a.events.filter(e => e.kind !== "terminated").map(e => `<span class="dm" style="left:${(G.at(Math.min(e.at, n))*100).toFixed(2)}%;background:${e.kind==="released"?"var(--fg)":"var(--accent)"}" title="${esc(e.kind)} ${esc(JSON.stringify(Object.fromEntries(Object.entries(e).filter(([k]) => !["kind","at"].includes(k)))))}"></span>`).join("");
  const flag = (i, label, color) => { if (i === null || i === undefined) return "";
    const at = G.at(Math.min(i, n-0.5)), side = at > 0.7 ? "right:1px;left:auto" : "left:1px";  /* keep labels inside the timeline */
    return `<div class="flag" style="left:${(at*100).toFixed(2)}%;background:${color}"><span style="background:${color};${side}">${label}</span></div>`; };
  const fIdx = a.first_fail ?? (failed(a) ? n - 0.5 : null);
  return `<section class="tl" aria-label="Timeline">
    <div class="tlhead"><span class="mono" style="color:var(--hi);font-size:14px">${a.calls.length} primitive calls</span><div style="flex:1"></div>
      <span class="mono">P perturbation applied at reset</span><span class="mono">D first call that differs from the nominal run</span><span class="mono">F first failed call</span>${a.video ? '<span class="mono" style="color:var(--hi)">| playhead · click or drag to seek</span>' : ""}</div>
    <div class="tlbody">
      <div class="tlnames"><div style="height:30px"></div><div style="height:34px">Phase</div><div style="height:30px">Calls</div><div style="height:30px">Events</div></div>
      <div class="tlarea" id="tlarea">${a.video ? '<div class="playhead" id="ph" hidden></div>' : ""}
        <div class="lane" style="height:30px"></div>
        <div class="lane" style="height:34px">${phases}</div>
        <div class="lane" style="height:30px">${dms}</div>
        <div class="lane" style="height:30px;border-bottom:0">${evs}</div>
        ${flag(0, "P", "#8A8A8A")}${failed(a) && a.divergence === a.first_fail
          ? flag(fIdx, "D = F · call " + (Math.floor(fIdx) + 1), "#FF4D4D")
          : flag(a.divergence, "D · call " + ((a.divergence ?? 0) + 1), "#EDEDED") + (failed(a) ? flag(fIdx, "F · call " + (Math.floor(fIdx) + 1), "#FF4D4D") : "")}
      </div>
    </div></section>`;
}
function videos(a){
  const clip = (src, label, color, id) => `<div class="vid"><span class="mono" style="color:${color}">${label}</span>
    <video id="${id}" src="${esc(src)}" muted playsinline preload="auto"></video></div>`;
  if (!a.video && !D.nominal_video) return `<div class="empty">No video for this attack: the test world records none; on the simulator, videos sit next to studio.html in the run folder.</div>`;
  return `<section style="display:flex;flex-direction:column;gap:10px"><span class="h">Rollout video</span><div class="vids">
    ${a.video ? clip(a.video, "Attack #" + a.n + " · " + esc(a.category) + " · " + (failed(a) ? "failed" : a.outcome === "error" ? "program error" : "passed"), failed(a) ? "var(--fail)" : "var(--hi)", "vA") : '<div class="vid empty">No video recorded for this attack.</div>'}
    ${D.nominal_video ? clip(D.nominal_video, "Nominal run · no perturbation", "var(--muted)", "vN") : ""}
  </div>
  <div class="player" role="group" aria-label="Video player">
    <button id="pp" aria-label="Play or pause">▶</button>
    <span class="mono" id="tm" style="min-width:110px">0:00.0 / 0:00.0</span>
    <input type="range" id="scrub" min="0" max="1000" step="1" value="0" aria-label="Seek">
    <label class="mono note" style="display:flex;align-items:center;gap:6px">speed <select id="spd" aria-label="Playback speed">${[0.25, 0.5, 1, 1.5, 2, 4].map(v => `<option value="${v}"${v === 1 ? " selected" : ""}>${v}×</option>`).join("")}</select></label>
  </div>
  <span class="note">Both videos play in sync. Space play/pause · ← → 1 s · drag the slider or the call timeline to seek. Videos load from the run folder: keep studio.html next to its aspire/ folder when copying.</span></section>`;
}
function why(a){
  const draws = Object.entries(a.draws || {}).sort((x, y) => y[1] - x[1]);
  const mx = Math.max(...draws.map(d => d[1]), 0.01);
  const sel = `<div class="bars" style="grid-template-columns:80px minmax(0,1fr) 44px">${draws.map(([c, v]) => `<span style="${c===a.category?"color:var(--hi)":""}">${esc(c)}</span><div class="track"><b style="width:${v/mx*100}%;${c===a.category?"background:var(--accent)":""}"></b></div><span class="mono" style="text-align:right">${fx(v)}</span>`).join("")}</div>
    <span class="note">${a.explored ? "This category was an exploration pick (the η share of uniform choices)." : "Thompson sampling: one draw per category from its failure-rate belief; the highest draw is attacked."}</span>`;
  const p = a.proposal || {}, cands = p.candidates || [];
  let prop;
  if (p.source === "model" && cands.length){
    const chosen = cands.reduce((b, c) => (c.novelty ?? 1e9) > (b.novelty ?? 1e9) ? c : b, cands[0]);
    prop = `<div class="agents">${cands.map((c, i) => `<div class="agent${c === chosen ? " chosen" : ""}">
      <div style="display:flex;justify-content:space-between;gap:8px"><span class="badge meta">Muse Spark · agent ${i+1}</span>${c === chosen ? '<span class="badge acc">chosen · most novel</span>' : ""}</div>
      <div style="color:var(--hi)">${esc(c.assumption || "—")}</div>
      <div style="color:var(--soft)">${esc(c.rationale || "")}</div>
      <div class="mono note">${esc(params(c.params))} · severity ${fx(c.severity)} · novelty ${c.novelty === null ? "first in category" : fx(c.novelty)}</div></div>`).join("")}</div>`;
  } else {
    prop = `<div class="empty">${p.source && p.source.startsWith("fallback") ? "Muse Spark proposal unavailable (" + esc(p.source.slice(10)) + "); the severity sampler chose this attack." : "Rules-only run: the severity sampler chose the values. Run with --model muse-spark to see four Muse Spark agents reason about the code."}</div>`;
  }
  return `<section style="display:flex;flex-direction:column;gap:10px"><span class="h">Why this attack · category</span>${sel}</section>
    <section style="display:flex;flex-direction:column;gap:10px"><span class="h">Why these values · proposers</span>${prop}</section>`;
}
function codeBlock(line, v){
  const lines = progOf(v).split("\n");
  const lo = line ? Math.max(1, line - 3) : 1, hi = line ? Math.min(lines.length, line + 3) : 0;
  if (!line) return "";
  return `<div class="code">${lines.slice(lo-1, hi).map((t, i) => `<div class="${lo+i===line?"hl":""}"><span class="n">${lo+i}</span>${esc(t)}</div>`).join("")}</div>`;
}
function replay(id){
  if (!A.length) return `<div class="main"><div class="empty">No attacks in this run.</div></div>`;

  const st = a.status || {}, counts = st.counts || {}, upper = st.upper || {};
  const rob = C.categories.map(c => { const f = (counts[c]||[0,0])[0], u = upper[c] ?? 1;
    return `<span style="${c===a.category?"color:var(--hi)":""}">${esc(c)}</span><div class="track"><b style="width:${Math.min(100,u/0.3*100)}%;${c===a.category?"background:var(--accent)":""}${f?";background:var(--fail)":""}"></b><i style="left:33.3%"></i></div><span class="mono" style="text-align:right">${fx(u)}</span>`; }).join("");

        <div><div class="l">Rule check</div><div>${agree}</div></div>

        <div><div class="l">Regression gate</div><div style="color:${a.loop ? (a.loop.decision === "accepted" ? "var(--hi)" : "var(--fail)") : "var(--muted)"}">${a.loop && a.loop.decision ? DEC[a.loop.decision][0] : "not run"}</div></div>
      </div></section>
    <section style="display:flex;flex-direction:column;gap:8px"><div class="h" style="display:flex;justify-content:space-between"><span>What went wrong</span><span style="letter-spacing:0;text-transform:none;${a.explanation_source==="model"?"color:var(--meta)":""}">${a.explanation_source==="model"?"Muse Spark":"template"}</span></div>
      <p style="font-size:14px;line-height:1.6">${esc(a.explanation)}</p></section>
    <section style="display:flex;flex-direction:column;gap:8px"><div class="h" style="display:flex;justify-content:space-between"><span>Root cause</span><span class="mono" style="letter-spacing:0;text-transform:none">${a.line ? "v"+a.version+" · line "+a.line : ""}</span></div>

      <p style="color:var(--hi)">${esc(a.rule)}</p><p class="note">Applies ${esc(a.when)}</p>
      ${a.code_sketch ? `<div class="code">${a.code_sketch.split("\n").map(t => `<div class="add"><span style="color:var(--accent)">+ </span>${esc(t)}</div>`).join("")}</div>` : ""}
      ${a.loop && a.loop.gate ? "" : '<p class="note">' + (L ? "No rewrite was attempted for this attack." : "Rewrite and gate verdict appear here once System 1 is connected.") + "</p>"}</section>
    ${a.loop && a.loop.gate ? `<section style="display:flex;flex-direction:column;gap:8px"><div class="h" style="display:flex;justify-content:space-between"><span>Rewrite v${a.loop.policy_version} → v${a.loop.candidate_version}</span>${decBadge(a.loop.decision)}</div>

      <div class="note">${v.constraint ? esc(v.constraint.failure_signature) : esc(R.policy.path)}</div></div></div>`).join("")}
    ${L ? "" : '<p class="note pad">Rewrites appear here when System 1 is connected.</p>'}

/* One transport for both videos: the attack video is the clock, the nominal follows it. */
let PLAYER = null;
function initPlayer(){
  if (PLAYER) PLAYER.stop();
  PLAYER = null;
  const vA = document.getElementById("vA"), vN = document.getElementById("vN");
  const vids = [vA, vN].filter(Boolean);
  if (!vids.length) return;
  const master = vA || vN, pp = document.getElementById("pp"), scrub = document.getElementById("scrub");
  const tm = document.getElementById("tm"), spd = document.getElementById("spd");
  const ph = document.getElementById("ph"), area = vA ? document.getElementById("tlarea") : null;
  let raf = 0, dragging = false;
  const dur = () => (isFinite(master.duration) ? master.duration : 0);
  const clock = t => { t = Math.max(0, t || 0); return Math.floor(t / 60) + ":" + (t % 60).toFixed(1).padStart(4, "0"); };
  const paint = () => {
    const d = dur(), t = master.currentTime;
    tm.textContent = clock(t) + " / " + clock(d);
    if (!dragging) scrub.value = d ? Math.round(t / d * 1000) : 0;
    if (ph && d) { ph.hidden = false; ph.style.left = (Math.min(t / d, 1) * 100).toFixed(3) + "%"; }
    pp.textContent = master.paused ? "▶" : "❚❚";
  };
  const seek = t => {
    t = Math.min(Math.max(0, t), dur());
    for (const v of vids) if (isFinite(v.duration)) v.currentTime = Math.min(t, v.duration);
    paint();
  };
  const play = () => { if (master.ended) seek(0); for (const v of vids) if (!v.ended || v === master) v.play().catch(() => {}); };
  const pause = () => { for (const v of vids) v.pause(); };
  const tick = () => {
    for (const v of vids) if (v !== master && !master.paused && isFinite(v.duration) && master.currentTime < v.duration
      && Math.abs(v.currentTime - master.currentTime) > 0.15) v.currentTime = master.currentTime;
    paint();
    raf = requestAnimationFrame(tick);
  };
  pp.onclick = () => (master.paused ? play() : pause());
  scrub.oninput = () => { dragging = true; seek(scrub.value / 1000 * dur()); };
  scrub.onchange = () => { dragging = false; };
  spd.onchange = () => { for (const v of vids) v.playbackRate = +spd.value; };
  master.addEventListener("ended", () => { pause(); paint(); });
  if (area) {
    area.classList.add("seek");
    const to = e => { const r = area.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * dur()); };
    area.onpointerdown = e => { area.setPointerCapture(e.pointerId); to(e); area.onpointermove = to; };
    area.onpointerup = area.onpointercancel = () => { area.onpointermove = null; };
  }
  const onKey = e => {
    if (e.target.closest && e.target.closest("input,select,button,textarea")) return;
    if (e.code === "Space") { e.preventDefault(); master.paused ? play() : pause(); }
    else if (e.key === "ArrowRight") seek(master.currentTime + 1);
    else if (e.key === "ArrowLeft") seek(master.currentTime - 1);
  };
  document.addEventListener("keydown", onKey);
  raf = requestAnimationFrame(tick);
  /* Opening an attack in Replay starts playback (muted, so browsers allow it). */
  if (master.readyState >= 1) play(); else master.addEventListener("loadedmetadata", play, {once: true});
  PLAYER = {stop() { cancelAnimationFrame(raf); document.removeEventListener("keydown", onKey); pause(); }};
}

function render(){
  const h = location.hash.slice(1);
  const view = h === "versions" ? "versions" : (h === "replay" || h.startsWith("a-")) ? "replay" : "harden";
  document.getElementById("app").innerHTML = view === "versions" ? versions() : view === "replay" ? replay(h.startsWith("a-") ? h.slice(2) : null) : harden();
  initPlayer();
  for (const t of ["harden", "replay", "versions"]) {
    const el = document.getElementById("tab-" + t);
    if (t === view) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current");
  }
  window.scrollTo(0, 0);
}
document.getElementById("runname").textContent = R.name;
if (L) document.getElementById("tab-versions").hidden = false;
document.getElementById("counter").textContent = `attack ${A.length} / ${R.attacks_planned}`;
document.title = `ANTS Studio · ${R.name}`;
window.addEventListener("hashchange", render);
render();
</script>
