<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANTS Live Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --panel:#0A0A0A; --raise:#111111; --line:#262626; --line2:#1F1F1F;
  --fg:#EDEDED; --hi:#FFFFFF; --soft:#B5B5B5; --muted:#8A8A8A; --dim:#6E6E6E; --faint:#3D3D3D;
  --accent:#F59342; --fail:#FF4D4D; --pass:#3D3D3D; --meta:#7AA7FF; --built:#4FD67A; --planned:#6E6E6E;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:13px/1.45 var(--sans)}
header{display:flex;align-items:center;gap:16px;min-height:52px;border-bottom:1px solid var(--line);padding:0 20px}
header .title{font-weight:600}
header .phase{color:var(--muted);font-size:12px}
.status-pill{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--line);color:var(--muted)}
.status-pill.running{color:var(--accent);border-color:var(--accent)}
.status-pill.done{color:var(--built);border-color:var(--built)}
.status-pill.error{color:var(--fail);border-color:var(--fail)}
.btn{display:inline-block;background:var(--raise);border:1px solid var(--line);color:var(--fg);padding:7px 16px;cursor:pointer;font:inherit;font-weight:500}
.btn:hover{border-color:var(--soft)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.on{color:var(--accent);border-color:var(--accent)}
main{display:grid;grid-template-columns:var(--lw,280px) 6px minmax(0,1fr) 6px var(--rw,300px);background:var(--bg);height:calc(100vh - 93px)}
.col{background:var(--bg);overflow-y:auto;padding:16px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.resize-handle{cursor:col-resize;background:var(--line)}
.resize-handle:hover,.resize-handle.dragging{background:var(--accent)}
.scene2d{margin-bottom:18px}
.scene2d-head{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.scene2d-head .asof{font-size:10.5px;color:var(--dim);margin-left:auto}
.scene2d svg{width:100%;height:auto;background:var(--panel);border:1px solid var(--line)}
.scene2d svg text{font:500 9px var(--mono);fill:var(--soft)}
.scene2d svg text.m{fill:var(--dim);font-size:8px}
.scene2d-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:var(--muted);margin-top:6px}
.scene2d-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.scene2d-note{font-size:10.5px;color:var(--dim);margin-top:6px;line-height:1.5}
.h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:10px}
.tool{border:1px solid var(--line);background:var(--panel);padding:8px 10px;margin-bottom:8px;border-left:3px solid var(--faint)}
.tool .name{font-family:var(--mono);font-size:12px}
.tool .role{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--meta);margin-top:2px}
.tool .desc{font-size:11px;color:var(--soft);margin-top:4px}
.center-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.incumbent{font-family:var(--mono);font-size:12px;color:var(--muted)}
.turns{display:flex;flex-direction:column;gap:6px}
.turn{border:1px solid var(--line);background:var(--panel);padding:10px 12px}
.turn .tk{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.turn.task .tk{color:var(--meta)}
.turn.task.completed{border-left:3px solid var(--built)}
.turn.task.started{border-left:3px solid var(--accent)}
.turn.task.proposed, .turn.task.accepted{border-left:3px solid var(--faint)}
.turn .main{font-size:12px;margin-top:4px}
.turn .delta{font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--soft)}
.turn.error{border-left:3px solid var(--fail)}
.turn.done{border-left:3px solid var(--built)}
.empty{color:var(--dim);font-size:12px;padding:20px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:16px}
.tile{background:var(--panel);padding:10px 12px}
.tile .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em} .tile .v{font-family:var(--mono);font-size:18px}
.reply{background:var(--panel);border:1px solid var(--line);padding:10px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;max-height:420px;overflow-y:auto}
.sysbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:40px;border-bottom:1px solid var(--line);padding:0 20px;font-size:12px}
.sys{display:flex;align-items:center;gap:7px;border:1px solid var(--line);padding:4px 10px}
.sys .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.sys.active .dot{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.sys .who{font-weight:600;letter-spacing:.03em}
.sys .stage{color:var(--muted)}
.sys.active .stage{color:var(--fg)}
.banner{display:none;border:1px solid var(--fail);background:#2a0f0f;color:#ffb3b0;padding:10px 14px;margin-bottom:14px;font-size:12.5px;line-height:1.5}
.banner.on{display:block}
.banner b{color:#ff8884}
.agentview{margin:18px 0}
.agentview-note{font-size:10.5px;color:var(--dim);line-height:1.5;margin-bottom:8px}
.agentview-grid{display:flex;flex-direction:column;gap:10px;max-height:360px;overflow-y:auto}
.agentview-pair{border:1px solid var(--line);background:var(--panel);padding:6px}
.agentview-pair .call{font-size:11px;color:var(--muted);margin-bottom:5px;font-family:var(--mono)}
.agentview-imgs{display:flex;gap:4px}
.agentview-imgs figure{margin:0;flex:1;min-width:0}
.agentview-imgs img{width:100%;display:block;border:1px solid var(--line2)}
.agentview-imgs figcaption{font-size:9.5px;color:var(--dim);text-align:center;margin-top:2px}
</style>
</head>
<body>
<header>
  <span class="title">ANTS Live Console</span>
  <span class="phase" id="phase-summary"></span>
  <span style="flex:1"></span>
  <span class="status-pill" id="status-pill">idle</span>
  <button class="btn" id="run-btn">Run policy development step</button>
</header>

<div class="sysbar">
  <div class="sys" id="sys1-badge"><span class="dot"></span><span class="who">System 1</span><span class="stage" id="sys1-stage">idle</span></div>
  <div class="sys" id="sys2-badge"><span class="dot"></span><span class="who">System 2</span><span class="stage" id="sys2-stage">idle</span></div>
  <div class="sys" id="orch-badge"><span class="dot"></span><span class="who">Orchestrator</span><span class="stage" id="orch-stage">idle</span></div>
</div>

<main>
  <div class="col" id="col-left">
    <div class="scene2d">
      <div class="h">Scene prompt</div>
      <div class="scene2d-head">
        <button class="btn sm on" id="scene-gen-btn">generation</button>
        <button class="btn sm" id="scene-repair-btn">repair</button>
        <span class="asof" id="scene-asof"></span>
      </div>
      <svg id="scene2d-svg" viewBox="0 0 240 240"></svg>
      <div class="scene2d-legend">
        <span><i style="background:#6fb2e0"></i>task object</span>
        <span><i style="background:#e8a553"></i>wine rack</span>
        <span><i style="background:#8a8a8a"></i>other object</span>
        <span><i style="background:#ff4d4d"></i>gripper</span>
      </div>
      <div class="scene2d-note" id="scene2d-note"></div>
    </div>
    <div class="agentview">
      <div class="h">Agentview frames</div>
      <div class="agentview-note" id="agentview-note"></div>
      <div class="agentview-grid" id="agentview-grid"></div>
    </div>
    <div id="tools-left-wrap"></div>
  </div>
  <div class="resize-handle" id="handle-left"></div>

  <div class="col" id="col-center">
    <div class="center-top">
      <span class="incumbent" id="incumbent-name"></span>
    </div>
    <div class="banner" id="banner"></div>
    <div class="turns" id="turns"><div class="empty">No run yet. Click "Run policy development step" to start one Phase A repair cycle.</div></div>
  </div>
  <div class="resize-handle" id="handle-right"></div>

  <div class="col" id="col-right">
    <div class="h">Loop config</div>
    <div class="tiles" id="config-tiles"></div>
    <div class="h">Orchestrator / System 2</div>
    <div id="tools-right"></div>
    <div class="h">Usage</div>
    <div class="tiles" id="usage-tiles"></div>
    <div class="h">Reply / summary</div>
    <div class="reply" id="reply-box">(waiting)</div>
  </div>
</main>

<script>
const DATA = /*__DATA__*/null;

function esc(s) {
  return String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderToolList(el, tools) {
  el.innerHTML = tools.map(t => `
    <div class="tool">
      <div class="name">${esc(t.name)}</div>
      <div class="role">${esc(t.role)}</div>
      <div class="desc">${esc(t.desc)}</div>
    </div>`).join("");
}

document.getElementById("phase-summary").textContent = DATA.phases_summary;
document.getElementById("incumbent-name").textContent = "incumbent: " + DATA.incumbent_name;
document.getElementById("tools-left-wrap").innerHTML = `<div class="h">System 1 / primitives</div>`;
const leftWrap = document.createElement("div");
renderToolList(leftWrap, DATA.tools_left);
document.getElementById("tools-left-wrap").appendChild(leftWrap);
renderToolList(document.getElementById("tools-right"), DATA.tools_right);

/* ---------- resizable columns ---------- */
(function () {
  const root = document.documentElement;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("ants-console-cols") || "{}"); } catch (e) {}
  if (saved.lw) root.style.setProperty("--lw", saved.lw + "px");
  if (saved.rw) root.style.setProperty("--rw", saved.rw + "px");

  function setupHandle(handle, varName, min, max, fromRight) {
    handle.addEventListener("pointerdown", (e) => {
      handle.classList.add("dragging");
      handle.setPointerCapture(e.pointerId);
      const onMove = (ev) => {
        const px = fromRight ? window.innerWidth - ev.clientX : ev.clientX;
        const clamped = Math.max(min, Math.min(max, px));
        root.style.setProperty(varName, clamped + "px");
      };
      const onUp = () => {
        handle.classList.remove("dragging");
        handle.removeEventListener("pointermove", onMove);
        handle.removeEventListener("pointerup", onUp);
        try {
          const lw = parseInt(getComputedStyle(root).getPropertyValue("--lw")) || 280;
          const rw = parseInt(getComputedStyle(root).getPropertyValue("--rw")) || 300;
          localStorage.setItem("ants-console-cols", JSON.stringify({ lw, rw }));
        } catch (err) {}
      };
      handle.addEventListener("pointermove", onMove);
      handle.addEventListener("pointerup", onUp);
    });
  }
  setupHandle(document.getElementById("handle-left"), "--lw", 200, 520, false);
  setupHandle(document.getElementById("handle-right"), "--rw", 220, 520, true);
})();

/* ---------- 2D scene illustration ---------- */
const SCENE_COLOR = { task: "#6fb2e0", rack: "#e8a553", other: "#8a8a8a" };
let sceneKind = "generation";
function renderScene2D(kind) {
  sceneKind = kind;
  document.getElementById("scene-gen-btn").classList.toggle("on", kind === "generation");
  document.getElementById("scene-repair-btn").classList.toggle("on", kind === "repair");
  const svg = document.getElementById("scene2d-svg");
  const noteEl = document.getElementById("scene2d-note");
  const asofEl = document.getElementById("scene-asof");
  const s2d = DATA.scene2d || {};
  const scene = s2d[kind];
  if (!scene) {
    svg.innerHTML = "";
    asofEl.textContent = "";
    noteEl.textContent = "no scene data (pass --scene / --scene-repair to the console)";
    return;
  }
  asofEl.textContent = "as of " + scene.as_of;
  noteEl.textContent = kind === "generation"
    ? "S4-style scene text given to System 1 for the first program (oracle geometry, no robot trajectory)."
    : "Scene given to the repair step" + (s2d.same_source ? " -- same data as generation; E3-style contact/stall evidence isn't wired into this console yet." : ".");

  const pad = 14;
  let xs = [], ys = [];
  for (const o of scene.objects) { xs.push(o.x0, o.x1); ys.push(o.y0, o.y1); }
  if (scene.gripper) { xs.push(scene.gripper.x); ys.push(scene.gripper.y); }
  const xMin = Math.min(...xs), xMax = Math.max(...xs), yMin = Math.min(...ys), yMax = Math.max(...ys);
  const scale = 1000; // metres -> mm -> px (1 px per mm)
  const w = (yMax - yMin) * scale + pad * 2;
  const h = (xMax - xMin) * scale + pad * 2;
  // screen x = -y (left is left on screen), screen y = -x (forward/+x is up on screen)
  const toX = (y) => (yMax - y) * scale + pad;
  const toY = (x) => (xMax - x) * scale + pad;
  const cx = (o) => toX((o.y0 + o.y1) / 2), cy = (o) => toY((o.x0 + o.x1) / 2);
  const byLabel = {};
  for (const o of scene.objects) byLabel[o.label] = o;

  let parts = [];
  for (const r of scene.relations) {
    const a = byLabel[r.a], b = byLabel[r.b];
    if (!a || !b) continue;
    const x1 = cx(a), y1 = cy(a), x2 = cx(b), y2 = cy(b);
    parts.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#444" stroke-dasharray="2,2" stroke-width="0.6"/>`);
    parts.push(`<text class="m" x="${((x1+x2)/2).toFixed(1)}" y="${((y1+y2)/2).toFixed(1)}">${r.mm} mm</text>`);
  }
  for (const o of scene.objects) {
    const x = toX(o.y1), y = toY(o.x1); // y1/x1 give the top-left corner under this axis mapping
    const bw = (o.y1 - o.y0) * scale, bh = (o.x1 - o.x0) * scale;
    const color = SCENE_COLOR[o.cat] || "#8a8a8a";
    parts.push(`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${color}" fill-opacity="0.35" stroke="${color}" stroke-width="1"/>`);
    parts.push(`<text x="${(x + 2).toFixed(1)}" y="${(y + 9).toFixed(1)}">${esc(o.label)}</text>`);
  }
  if (scene.gripper) {
    const gx = toX(scene.gripper.y), gy = toY(scene.gripper.x);
    parts.push(`<circle cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="3" fill="none" stroke="#ff4d4d" stroke-width="1.4" stroke-dasharray="2,1.5"/>`);
    parts.push(`<text x="${(gx + 5).toFixed(1)}" y="${(gy + 3).toFixed(1)}">gripper</text>`);
  }
  svg.setAttribute("viewBox", `0 0 ${Math.max(1, w).toFixed(1)} ${Math.max(1, h).toFixed(1)}`);
  svg.innerHTML = parts.join("");
}
document.getElementById("scene-gen-btn").addEventListener("click", () => renderScene2D("generation"));
document.getElementById("scene-repair-btn").addEventListener("click", () => renderScene2D("repair"));
renderScene2D("generation");

/* ---------- archived agentview frames (reference, not live) ---------- */
(function () {
  const archive = DATA.agentview_archive || { frames: [] };
  document.getElementById("agentview-note").textContent = archive.frames.length
    ? `Archived example (${esc(archive.source)}), not from this run — this console's loop uses the mock System 2 backend, which has no simulator or camera. Real frames need the ASPIRE/cap_harness backend.`
    : "No archived example found (expected under " + esc(archive.source || "data/runs/exp04_scene") + ").";
  const grid = document.getElementById("agentview-grid");
  const frames = archive.frames;
  const pairs = [];
  for (let i = 0; i < frames.length; i += 2) {
    if (frames[i + 1]) pairs.push([frames[i], frames[i + 1]]);
  }
  grid.innerHTML = pairs.map(([before, after]) => `
    <div class="agentview-pair">
      <div class="call">${esc(before.call)} <span style="color:var(--dim)">#${esc(before.index)}</span></div>
      <div class="agentview-imgs">
        <figure><img src="${before.src}" loading="lazy" alt="before ${esc(before.call)}"><figcaption>before</figcaption></figure>
        <figure><img src="${after.src}" loading="lazy" alt="after ${esc(after.call)}"><figcaption>after</figcaption></figure>
      </div>
    </div>`).join("") || `<div class="empty">no frames found</div>`;
})();

if (DATA.mode === "loop" && DATA.loop_config) {
  const c = DATA.loop_config;
  document.getElementById("config-tiles").innerHTML = [
    ["Max cycles", c.cycles], ["Severity (rho)", c.rho], ["Eta", c.eta],
    ["Stall window (W)", c.stall_window], ["Nominal seeds", c.nominal_seeds.join(", ")],
    ["Min tests to stop", c.min_tests], ["Adversary model", c.adversary_model],
    ["Reasoning effort", c.reasoning_effort], ["Max model steps", c.max_model_steps],
    ["Synth token budget", c.synth_token_budget],
  ].map(([l, v]) => `<div class="tile"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");
  runBtnLabel();
} else {
  document.getElementById("config-tiles").innerHTML = `<div class="empty">n/a (single-step mode)</div>`;
}

function runBtnLabel() {
  document.getElementById("run-btn").textContent =
    DATA.mode === "loop" ? "Run policy development loop" : "Run policy development step";
}
runBtnLabel();

const turnsEl = document.getElementById("turns");
const pill = document.getElementById("status-pill");
const runBtn = document.getElementById("run-btn");
let turnCount = 0;
let rewriteTokenTotal = 0;

function setStatus(kind, text) {
  pill.className = "status-pill " + kind;
  pill.textContent = text;
}

function addTurn(cls, html) {
  if (turnCount === 0) turnsEl.innerHTML = "";
  turnCount++;
  const div = document.createElement("div");
  div.className = "turn " + cls;
  div.innerHTML = html;
  turnsEl.insertBefore(div, turnsEl.firstChild); // newest on top
}

/* ---------- System 1 / System 2 / Orchestrator status ---------- */
function setSys(id, active, stage) {
  const badge = document.getElementById(id + "-badge");
  badge.classList.toggle("active", active);
  document.getElementById(id + "-stage").textContent = stage;
}
function resetSys() {
  setSys("sys1", false, "idle");
  setSys("sys2", false, "idle");
  setSys("orch", false, "idle");
}

/* ---------- blocking-state banner ---------- */
function showBanner(html) {
  const el = document.getElementById("banner");
  el.innerHTML = html;
  el.classList.add("on");
}
function hideBanner() {
  document.getElementById("banner").classList.remove("on");
}

function handleMuseEvent(event) {
  const pt = event.payload_type || "";
  if (pt.startsWith("task.lifecycle.")) {
    const payload = event.payload || {};
    const inner = payload.event || {};
    const kind = inner.kind || payload.kind || "?";
    const taskKind = inner.task_kind || "task";
    addTurn("task " + esc(kind), `<div class="tk">${esc(taskKind)}</div><div class="main">${esc(kind)}</div>`);
  } else if (pt === "run.output.delta") {
    const text = (event.payload || {}).text || "";
    addTurn("delta", `<div class="tk">output</div><div class="delta">${esc(text)}</div>`);
  } else {
    addTurn("other", `<div class="tk">${esc(pt || "event")}</div>`);
  }
}

function handleLoopEvent(row) {
  const event = row.event;
  if (event === "start") {
    setSys("sys2", false, "idle (nominal check)");
    setSys("orch", true, "checking nominal cases");
    addTurn("task started", `<div class="tk">loop</div><div class="main">started: ${esc(row.policy && row.policy.id)} v${row.policy && row.policy.version}</div>`);
  } else if (event === "cycle") {
    setSys("sys1", false, "idle");
    const decision = row.decision || "?";
    const cls = decision === "accepted" ? "task completed" : decision === "rejected" ? "error" : "task";
    if (decision === "no_failure") {
      setSys("sys2", true, "selecting next attack");
      setSys("orch", false, "idle");
    } else if (decision === "budget_stop") {
      setSys("sys2", false, "idle");
      setSys("orch", true, "blocked: budget exhausted");
      showBanner(`<b>Budget exhausted.</b> System 1's rewrite budget (${esc(String(row.cycle))} cycles in) ran out before the loop could reach a stop condition. It cannot continue on its own from here &mdash; raise <code>--synth-token-budget</code> and re-run, or treat this as a point for human review.`);
    } else {
      setSys("sys2", false, "idle (result logged)");
      setSys("orch", true, decision === "accepted" ? "gate: accepted" : "gate: rejected");
    }
    let main = `cycle ${row.cycle}: attack <b>${esc(row.category)}</b> (severity ${row.severity}) &rarr; <b>${esc(row.outcome)}</b>`;
    if (row.decision) main += ` &rarr; <b>${esc(decision)}</b>`;
    if (row.signature) main += `<br><span class="delta">signature: ${esc(row.signature)}</span>`;
    if (row.rewrite_tokens) {
      rewriteTokenTotal += row.rewrite_tokens;
      main += `<br><span class="delta">rewrite: ${row.rewrite_tokens} tokens ($${row.rewrite_cost_usd ?? "?"})</span>`;
      const budget = DATA.loop_config ? DATA.loop_config.synth_token_budget : null;
      document.getElementById("usage-tiles").innerHTML = [
        ["Rewrites so far", row.candidate_version ? "see cycles" : "-"],
        ["Rewrite tokens (running)", rewriteTokenTotal],
      ].concat(budget ? [["Budget remaining", Math.max(0, budget - rewriteTokenTotal)]] : [])
        .map(([l, v]) => `<div class="tile"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");
    }
    if (row.gate) {
      main += `<br><span class="delta">gate: ${row.gate.accepted ? "accepted" : "rejected"} (${row.gate.cases} cases, +${(row.gate.improvements||[]).length})</span>`;
    }
    addTurn(cls, `<div class="tk">cycle ${row.cycle}</div><div class="main">${main}</div>`);
    if (row.diff) {
      addTurn("delta", `<div class="tk">diff v${row.policy_version || "?"} &rarr; v${row.candidate_version || "?"}</div><div class="delta">${esc(row.diff)}</div>`);
    }
  } else if (event === "escalate") {
    setSys("sys1", false, "idle");
    setSys("sys2", false, "idle");
    setSys("orch", true, "blocked: escalated");
    showBanner(`<b>Escalated &mdash; needs human intervention.</b> ${esc(row.request)}<br>signature <code>${esc(row.signature)}</code> stalled ${row.stalled_cycles} cycles in a row (W). The loop will not continue past this without a human answer.`);
    addTurn("error", `<div class="tk">escalate</div><div class="main">${esc(row.request)}<br><span class="delta">signature: ${esc(row.signature)}, stalled ${row.stalled_cycles} cycles</span></div>`);
  } else if (event === "no_working_policy") {
    setSys("sys1", false, "idle");
    setSys("sys2", false, "idle");
    setSys("orch", true, "blocked: no working policy");
    showBanner(`<b>No working policy &mdash; needs human intervention.</b> ${esc(row.request)}. v0 fails its own nominal cases, so there is nothing for System 2 to attack yet.`);
    addTurn("error", `<div class="tk">no working policy</div><div class="main">${esc(row.request)}</div>`);
  } else if (event === "end") {
    addTurn("done", `<div class="tk">loop end</div><div class="main">stopped: <b>${esc(row.stopped)}</b>, stage: ${esc(row.stage)}, final v${row.final_version}, cycles run: ${row.cycles_run}</div>`);
  } else {
    addTurn("other", `<div class="tk">${esc(event || "loop event")}</div>`);
  }
}

function handleAttackEvent(a) {
  setSys("sys2", false, "idle");
  if (a.outcome === "failure") {
    setSys("orch", true, "failure found, routing to System 1");
    setSys("sys1", true, "writing repair (muse exec)");
  } else {
    setSys("orch", true, "replaying candidate / checking robust");
  }
  addTurn("task", `<div class="tk">attack ${esc(a.attack_id)}</div><div class="main">System 2 attacked with <b>${esc(a.category)}</b> (severity ${a.severity}) &rarr; <b>${esc(a.outcome)}</b></div>`);
}

function handleDone(payload) {
  setStatus("done", "done");
  runBtn.disabled = false;
  resetSys();
  if (DATA.mode === "loop") {
    const blocked = ["budget", "escalate", "no_working_policy"].includes(payload.stopped);
    if (blocked && !document.getElementById("banner").classList.contains("on")) {
      showBanner(`<b>Stopped: ${esc(payload.stopped)} &mdash; needs human intervention.</b> The loop cannot make further progress on its own.`);
    }
    addTurn("done", `<div class="tk">run complete</div><div class="main">stopped: <b>${esc(payload.stopped)}</b>, stage: ${esc(payload.stage)}, accepted versions: ${JSON.stringify(payload.accepted_versions)}</div>`);
    document.getElementById("reply-box").textContent = JSON.stringify(payload, null, 1);
    return;
  }
  addTurn("done", `<div class="tk">run complete</div><div class="main">final reply received</div>`);
  const u = payload.usage || {};
  document.getElementById("usage-tiles").innerHTML = [
    ["Input tokens", u.input_tokens], ["Output tokens", u.output_tokens],
    ["Reasoning tokens", u.reasoning_tokens], ["Cached tokens", u.cached_tokens],
  ].map(([l, v]) => `<div class="tile"><div class="l">${l}</div><div class="v">${v ?? 0}</div></div>`).join("");
  document.getElementById("reply-box").textContent = payload.text || "(empty reply)";
}

function handleError(payload) {
  setStatus("error", "error");
  runBtn.disabled = false;
  addTurn("error", `<div class="tk">error</div><div class="main">${esc(payload.message)}</div>`);
}

function openStream() {
  const es = new EventSource("/events");
  es.onmessage = (ev) => {
    const data = JSON.parse(ev.data);
    if (data.kind === "muse_event") handleMuseEvent(data.event);
    else if (data.kind === "loop_event") handleLoopEvent(data.row);
    else if (data.kind === "attack_event") handleAttackEvent(data);
    else if (data.kind === "done") { handleDone(data); es.close(); }
    else if (data.kind === "error") { handleError(data); es.close(); }
  };
  es.onerror = () => es.close();
}

runBtn.addEventListener("click", () => {
  const gateMsg = DATA.mode === "loop"
    ? "Ready to run the policy development phase?\n\n" +
      "This runs the real closed loop: System 2 attacks (mock backend, free) and System 1 " +
      "rewrites for real via muse exec (Muse Code), up to " + (DATA.loop_config ? DATA.loop_config.cycles : "N") +
      " cycles. Each rewrite spends Muse tokens (observed ~$0.5 per rewrite); the loop stops " +
      "earlier if it becomes robust, stalls, or hits the token budget."
    : "Ready to run the policy development phase?\n\n" +
      "This sends one real request to muse exec (Muse Code) and spends Muse tokens " +
      "(observed ~$0.5 per repair step). It runs one Phase A repair step against the incumbent " +
      "program shown here, not the full loop.";
  const ok = window.confirm(gateMsg);
  if (!ok) return;
  rewriteTokenTotal = 0;
  runBtn.disabled = true;
  turnCount = 0;
  turnsEl.innerHTML = "";
  hideBanner();
  setSys("sys1", DATA.mode === "single", "active (muse exec)");
  if (DATA.mode === "loop") { setSys("sys2", false, "idle"); setSys("orch", true, "starting"); }
  setStatus("running", "running");
  document.getElementById("reply-box").textContent = "(waiting)";
  openStream();
  fetch("/run", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({confirmed: true}),
  }).then(r => r.json()).then(r => {
    if (!r.ok) { handleError({message: r.error}); }
  });
});
</script>
