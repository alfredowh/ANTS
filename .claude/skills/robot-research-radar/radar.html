<title>Robot Research Radar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab-notebook console. Sticky top bar, left rail of labs, main list of works, detail drawer on the right. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --sunk: #e8ecf0;
  --line: #d3dae2;
  --ink: #142231;
  --muted: #5a6b7c;
  --accent: #1f4fd1;
  --accent-ink: #ffffff;
  --accent-soft: #e2e9fb;
  --good: #1d7a4a;
  --good-soft: #dff3e7;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --bad: #b3261e;
  --bad-soft: #f9e1df;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151d; --surface: #152029; --sunk: #1b2833; --line: #2a3a48; --ink: #e3eaf1; --muted: #93a4b5;
    --accent: #7d9cff; --accent-ink: #0b1220; --accent-soft: #1d2b4d;
    --good: #6fd19c; --good-soft: #15352a; --warn: #f0b35a; --warn-soft: #3a2b12; --bad: #ff8a80; --bad-soft: #3d1c1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151d; --surface: #152029; --sunk: #1b2833; --line: #2a3a48; --ink: #e3eaf1; --muted: #93a4b5;
  --accent: #7d9cff; --accent-ink: #0b1220; --accent-soft: #1d2b4d;
  --good: #6fd19c; --good-soft: #15352a; --warn: #f0b35a; --warn-soft: #3a2b12; --bad: #ff8a80; --bad-soft: #3d1c1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.bar-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; max-width: 1400px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.brand .sub { color: var(--muted); font-size: 12px; }
.stats { display: flex; gap: 14px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 500; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 6px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 3px 8px; font-size: 12px; }

.wrap { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); } }

.rail { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.rail-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { flex: 1; border: 0; background: none; padding: 5px 4px; cursor: pointer; font-size: 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.orgs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); max-height: 70vh; overflow: auto; }
@media (max-width: 860px) { .orgs { max-height: 260px; } }
.org { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.org:last-child { border-bottom: 0; }
.org:hover { background: var(--sunk); }
.org[aria-current="true"] { background: var(--accent-soft); }
.org .rank { font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.org .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.org .meta { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.org .cnt { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.type-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.t-company { background: var(--accent); } .t-institute { background: var(--warn); } .t-university { background: var(--good); }

.main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.orgcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.orgcard h2 { font-family: var(--f-display); font-size: 22px; margin: 0; font-weight: 700; text-wrap: balance; }
.orgcard .row { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 13px; }
.orgcard .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters input[type="search"] { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); border-radius: var(--r); padding: 7px 10px; background: var(--surface); }
.filters select { border: 1px solid var(--line); border-radius: var(--r); padding: 6px 8px; background: var(--surface); }

.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; min-width: 760px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--sunk); position: sticky; top: 0; cursor: pointer; white-space: nowrap; }
th[aria-sort] { color: var(--ink); }
tr.work { cursor: pointer; }
tr.work:hover td { background: var(--sunk); }
tr.work[aria-selected="true"] td { background: var(--accent-soft); }
td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.wt { font-weight: 600; }
.ws { color: var(--muted); font-size: 12.5px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.fit { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-mono); font-size: 12px; white-space: nowrap; }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 8px; height: 8px; border-radius: 2px; background: var(--line); }
.pips i.on { background: var(--accent); }
.status { font-size: 11px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.s-verified { background: var(--good-soft); color: var(--good); }
.s-draft { background: var(--warn-soft); color: var(--warn); }
.s-queued { background: var(--accent-soft); color: var(--accent); }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-family: var(--f-display); font-size: 17px; margin-bottom: 4px; }
.note { font-size: 12px; color: var(--muted); }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: var(--r); padding: 8px 12px; font-size: 13px; }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); border-left: 1px solid var(--line); z-index: 20;
  box-shadow: -12px 0 32px rgba(0,0,0,.12); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-head { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.drawer-head h3 { font-family: var(--f-display); font-size: 19px; margin: 0; flex: 1; min-width: 0; text-wrap: balance; }
.drawer-body { overflow: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.sec h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sec p { margin: 0; max-width: 65ch; }
.crit { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.crit li { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 8px; font-size: 13px; }
.mark { font-family: var(--f-mono); font-size: 11px; padding: 1px 0; border-radius: 4px; text-align: center; height: fit-content; }
.m-yes { background: var(--good-soft); color: var(--good); } .m-part { background: var(--warn-soft); color: var(--warn); } .m-no { background: var(--bad-soft); color: var(--bad); } .m-na { background: var(--sunk); color: var(--muted); }
.verdict { padding: 10px 12px; border-radius: var(--r); background: var(--sunk); }
.verdict b { font-family: var(--f-display); }

form.add { display: flex; flex-direction: column; gap: 10px; }
form.add label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
form.add input, form.add textarea, form.add select { border: 1px solid var(--line); border-radius: var(--r); padding: 7px 9px; background: var(--bg); color: var(--ink); font-size: 14px; }
form.add textarea { min-height: 110px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
.stream { font-family: var(--f-mono); font-size: 12px; white-space: pre-wrap; background: var(--sunk); border-radius: var(--r); padding: 10px; max-height: 180px; overflow: auto; color: var(--muted); }
.err { color: var(--bad); font-size: 13px; }
.scrim { position: fixed; inset: 0; background: rgba(10,20,30,.35); z-index: 15; }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
</style>

<header class="bar">
  <div class="bar-inner">
    <div class="brand"><h1>Robot Research Radar</h1><span class="sub">labs and works, reviewed against ANTS</span></div>
    <div class="stats" id="stats"><span><b>–</b> labs</span><span><b>–</b> works</span></div>
    <button class="btn" id="btnAddOrg" type="button">Add lab</button>
    <button class="btn primary" id="btnAddWork" type="button">Add work from link</button>
  </div>
</header>

<div class="wrap">
  <aside class="rail">
    <div class="rail-head"><span class="label">Labs, ranked</span><span class="note" id="orgCount"></span></div>
    <div class="seg" role="group" aria-label="Lab type">
      <button type="button" data-type="all" aria-pressed="true">All</button>
      <button type="button" data-type="company" aria-pressed="false">Company</button>
      <button type="button" data-type="institute" aria-pressed="false">Institute</button>
      <button type="button" data-type="university" aria-pressed="false">University</button>
    </div>
    <ul class="orgs" id="orgList"></ul>
    <p class="note"><span class="type-dot t-company"></span>company <span class="type-dot t-institute" style="margin-left:8px"></span>institute <span class="type-dot t-university" style="margin-left:8px"></span>university</p>
  </aside>

  <main class="main">
    <div id="banner" class="banner" hidden></div>
    <section class="orgcard" id="orgCard" hidden></section>
    <div class="filters">
      <input type="search" id="q" placeholder="Search title, summary, lab…" aria-label="Search works">
      <select id="fBlock" aria-label="ANTS building block"><option value="all">All ANTS blocks</option></select>
      <select id="fFit" aria-label="Minimum fit">
        <option value="0">Any fit</option><option value="1">Fit ≥ 1</option><option value="2">Fit ≥ 2</option><option value="3">Fit 3 only</option>
      </select>
      <select id="fSrc" aria-label="Source">
        <option value="all">All sources</option><option value="workspace">Discussed in ANTS docs</option><option value="draft">Drafts to verify</option>
      </select>
    </div>
    <div class="tablebox">
      <table>
        <thead><tr>
          <th data-sort="title">Work</th>
          <th data-sort="year">Year</th>
          <th data-sort="citations" class="num">Cites</th>
          <th data-sort="stars" class="num">Stars</th>
          <th data-sort="fit">ANTS fit</th>
          <th>Blocks</th>
          <th>Status</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="note" id="foot"></p>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-live="polite"></aside>

<script>
(() => {
  const BLOCKS = {
    "perception": "Perception", "human-video-to-robot": "Human video → robot", "demo-to-spec": "Demo → spec",
    "policy-synthesis": "Policy synthesis", "primitives-grasp-motion": "Primitives: grasp & motion", "verification": "Verification",
    "memory-skills": "Memory & skills", "adversary-testing": "Adversarial testing", "diagnosis": "Failure diagnosis",
    "simulation": "Simulation", "escalation": "Escalation & human help", "vla-baseline": "VLA baseline", "world-model": "World model"
  };
  const CRITERIA = [
    ["frozen", "Frozen generator: improves through context, no weight updates needed"],
    ["one_demo", "Learns from one (or few) demonstrations or a human video"],
    ["interpretable", "Interpretable policy (code, primitives, constraints) so a failure can become a constraint"],
    ["sim_testable", "Runs in simulation (LIBERO/MuJoCo) with repeatable rollouts for adversarial testing"],
    ["hardware", "Runs on one 16 GB GPU or through an API"],
    ["open", "Open code with a usable license"],
    ["fills_block", "Fills a concrete ANTS System 1 or System 2 building block"]
  ];
  const S = { orgs: [], works: [], type: "all", org: null, q: "", block: "all", fit: 0, src: "all", sort: "fit", dir: -1, open: null, mode: null };
  let db = null, sample = null, loaded = { orgs: false, works: false };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const slug = (s) => String(s || "").toLowerCase().replace(/https?:\/\//, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80) || ("w-" + Date.now());
  const fmt = (n) => n == null ? "–" : n >= 10000 ? (n / 1000).toFixed(0) + "k" : n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
  const pips = (n) => `<span class="pips">${[1, 2, 3].map((i) => `<i class="${i <= (n || 0) ? "on" : ""}"></i>`).join("")}</span>`;
  const orgName = (id) => (S.orgs.find((o) => o.id === id) || {}).name || id;
  const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : null;

  // ---------- rendering ----------
  function rankedOrgs() {
    return S.orgs.filter((o) => S.type === "all" || o.type === S.type)
      .sort((a, b) => (a.rank ?? 999) - (b.rank ?? 999) || a.name.localeCompare(b.name));
  }
  function worksFor(orgId) { return S.works.filter((w) => (w.org_ids || []).includes(orgId)); }

  function renderOrgs() {
    const list = rankedOrgs();
    $("orgCount").textContent = list.length ? `${list.length} shown` : "";
    if (!list.length) {
      $("orgList").innerHTML = `<li class="empty"><strong>${loaded.orgs ? "No labs yet" : "Loading labs…"}</strong>${loaded.orgs ? "Use Add lab, or ask Claude Code to run the radar crawl." : ""}</li>`;
      return;
    }
    $("orgList").innerHTML = list.map((o) => `
      <li class="org" data-org="${esc(o.id)}" aria-current="${S.org === o.id}" tabindex="0">
        <span class="rank">${o.rank ?? "·"}</span>
        <span style="min-width:0"><span class="nm"><span class="type-dot t-${esc(o.type)}"></span>${esc(o.name)}</span><span class="meta">${esc(o.country || "")}${o.focus ? " · " + esc(o.focus) : ""}</span></span>
        <span class="cnt">${worksFor(o.id).length}</span>
      </li>`).join("");
  }

  function renderOrgCard() {
    const o = S.orgs.find((x) => x.id === S.org);
    const card = $("orgCard");
    if (!o) { card.hidden = true; return; }
    card.hidden = false;
    const url = safeUrl(o.url);
    card.innerHTML = `
      <span class="label"><span class="type-dot t-${esc(o.type)}"></span>${esc(o.type)}${o.rank ? " · rank " + o.rank : ""}</span>
      <h2>${esc(o.name)}</h2>
      <div class="row">${o.country ? `<span>${esc(o.country)}</span>` : ""}${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">Website</a>` : ""}<span>${worksFor(o.id).length} works</span></div>
      ${o.focus ? `<p style="margin:0;max-width:75ch">${esc(o.focus)}</p>` : ""}
      ${(o.groups || []).length ? `<div class="chips">${o.groups.map((g) => `<span class="chip">${esc(g)}</span>`).join("")}</div>` : ""}
      ${o.why_ranked ? `<p class="note" style="margin:0">Why ranked: ${esc(o.why_ranked)}</p>` : ""}
      <div class="acts"><button class="btn small" type="button" data-act="clear-org">Show all labs</button><button class="btn small" type="button" data-act="add-work-org">Add work to this lab</button><button class="btn small danger" type="button" data-act="del-org">Delete lab</button></div>`;
  }

  function filteredWorks() {
    const q = S.q.trim().toLowerCase();
    let ws = S.works.filter((w) => {
      if (S.org && !(w.org_ids || []).includes(S.org)) return false;
      if (S.type !== "all" && !S.org && !(w.org_ids || []).some((id) => (S.orgs.find((o) => o.id === id) || {}).type === S.type)) return false;
      if (S.block !== "all" && !(w.ants_blocks || []).includes(S.block)) return false;
      if ((w.ants_fit_score || 0) < S.fit) return false;
      if (S.src === "workspace" && !w.workspace_ref) return false;
      if (S.src === "draft" && w.status === "verified") return false;
      if (q) {
        const hay = [w.title, w.short_name, w.solves, w.limitation, w.outlook, (w.org_ids || []).map(orgName).join(" ")].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const key = { title: (w) => (w.short_name || w.title || "").toLowerCase(), year: (w) => w.year || 0, citations: (w) => w.citations ?? -1, stars: (w) => w.stars ?? -1, fit: (w) => (w.ants_fit_score || 0) * 1e7 + (w.citations || 0) }[S.sort];
    ws.sort((a, b) => { const x = key(a), y = key(b); return (x > y ? 1 : x < y ? -1 : 0) * S.dir; });
    return ws;
  }

  function renderRows() {
    const ws = filteredWorks();
    document.querySelectorAll("th[data-sort]").forEach((th) => th.toggleAttribute("aria-sort", th.dataset.sort === S.sort));
    if (!ws.length) {
      $("rows").innerHTML = `<tr><td colspan="7"><div class="empty"><strong>${loaded.works ? (S.works.length ? "No works match these filters" : "No works yet") : "Loading works…"}</strong>${loaded.works && !S.works.length ? "Paste a paper or repo link with Add work from link." : ""}</div></td></tr>`;
    } else {
      $("rows").innerHTML = ws.map((w) => `
        <tr class="work" data-work="${esc(w.id)}" aria-selected="${S.open === w.id}" tabindex="0">
          <td style="min-width:260px"><div class="wt">${esc(w.short_name || w.title)}</div><div class="ws">${esc(w.solves || w.title || "")}</div><div class="note">${(w.org_ids || []).map((id) => esc(orgName(id))).join(", ")}</div></td>
          <td class="num" style="text-align:left">${esc(w.year || "–")}</td>
          <td class="num">${fmt(w.citations)}</td>
          <td class="num">${fmt(w.stars)}</td>
          <td><span class="fit">${pips(w.ants_fit_score)}${w.ants_fit_score ?? "–"}</span></td>
          <td><div class="chips">${(w.ants_blocks || []).slice(0, 3).map((b) => `<span class="chip">${esc(BLOCKS[b] || b)}</span>`).join("")}</div></td>
          <td><span class="status s-${esc(w.status || "verified")}">${esc(w.status || "verified")}</span></td>
        </tr>`).join("");
    }
    const dates = S.works.map((w) => w.metrics_date).filter(Boolean).sort();
    $("foot").textContent = `${ws.length} of ${S.works.length} works shown. Citations: Semantic Scholar; stars: GitHub${dates.length ? `; metrics as of ${dates[dates.length - 1]}` : ""}. Drafts come from in-page Claude and wait for a verified sync from Claude Code.`;
    $("stats").innerHTML = `<span><b>${S.orgs.length}</b> labs</span><span><b>${S.works.length}</b> works</span><span><b>${S.works.filter((w) => (w.ants_fit_score || 0) >= 3).length}</b> fit 3</span>`;
  }

  function render() { renderOrgs(); renderOrgCard(); renderRows(); if (S.open && !S.mode) renderDetail(); }

  // ---------- drawer ----------
  function openDrawer(html) { $("drawer").innerHTML = html; $("drawer").hidden = false; $("scrim").hidden = false; }
  function closeDrawer() { $("drawer").hidden = true; $("scrim").hidden = true; S.open = null; S.mode = null; renderRows(); }

  function reviewHtml(r) {
    if (!r) return "";
    const m = { yes: ["m-yes", "yes"], partial: ["m-part", "part"], no: ["m-no", "no"], unknown: ["m-na", "?"] };
    return `<div class="sec"><h4>Review against ANTS criteria</h4>
      <div class="verdict"><b>${esc(r.verdict_label || r.verdict || "")}</b>${r.summary ? " · " + esc(r.summary) : ""}</div>
      <ul class="crit" style="margin-top:8px">${CRITERIA.map(([k, label]) => { const c = (r.criteria || {})[k] || {}; const mk = m[c.mark] || m.unknown; return `<li><span class="mark ${mk[0]}">${mk[1]}</span><span><b>${esc(label)}</b>${c.note ? ". " + esc(c.note) : ""}</span></li>`; }).join("")}</ul></div>`;
  }

  function renderDetail() {
    const w = S.works.find((x) => x.id === S.open);
    if (!w) { closeDrawer(); return; }
    const links = [["Paper", w.url], ["arXiv", w.arxiv ? "https://arxiv.org/abs/" + w.arxiv : null], ["Code", w.github ? (w.github.startsWith("http") ? w.github : "https://github.com/" + w.github) : null]]
      .filter(([, u]) => safeUrl(u)).map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${n}</a>`).join(" · ");
    openDrawer(`
      <div class="drawer-head"><h3>${esc(w.title || w.short_name)}</h3><button class="btn small" type="button" data-act="close" aria-label="Close">Close</button></div>
      <div class="drawer-body">
        <dl class="kv">
          <dt>Labs</dt><dd>${(w.org_ids || []).map((id) => esc(orgName(id))).join(", ") || "–"}</dd>
          <dt>Venue · year</dt><dd>${esc(w.venue || "–")} · ${esc(w.year || "–")}</dd>
          <dt>Citations</dt><dd>${fmt(w.citations)}${w.metrics_date ? ` <span class="note">(${esc(w.metrics_date)})</span>` : ""}</dd>
          <dt>GitHub stars</dt><dd>${fmt(w.stars)}</dd>
          <dt>Links</dt><dd>${links || "–"}</dd>
          <dt>ANTS fit</dt><dd><span class="fit">${pips(w.ants_fit_score)}${w.ants_fit_score ?? "–"}</span> ${esc(w.ants_fit_reason || "")}</dd>
          <dt>Blocks</dt><dd><div class="chips">${(w.ants_blocks || []).map((b) => `<span class="chip">${esc(BLOCKS[b] || b)}</span>`).join("") || "–"}</div></dd>
          ${w.gpu_note ? `<dt>Hardware</dt><dd>${esc(w.gpu_note)}</dd>` : ""}
          ${w.workspace_ref ? `<dt>In ANTS docs</dt><dd>${esc(w.workspace_ref)}</dd>` : ""}
          <dt>Status</dt><dd><span class="status s-${esc(w.status || "verified")}">${esc(w.status || "verified")}</span>${w.status && w.status !== "verified" ? ` <span class="note">Ask Claude Code to "sync the radar" to verify facts and metrics.</span>` : ""}</dd>
        </dl>
        <div class="sec"><h4>What it solves</h4><p>${esc(w.solves || "–")}</p></div>
        <div class="sec"><h4>Limitation</h4><p>${esc(w.limitation || "–")}</p></div>
        <div class="sec"><h4>Outlook</h4><p>${esc(w.outlook || "–")}</p></div>
        ${reviewHtml(w.review)}
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${sample ? `<button class="btn small" type="button" data-act="rereview">Re-run ANTS review</button>` : ""}
          <button class="btn small danger" type="button" data-act="del-work">Delete work</button>
        </div>
        <p class="err" id="detailErr" hidden></p>
      </div>`);
  }

  function orgOptions(sel) {
    return S.orgs.slice().sort((a, b) => a.name.localeCompare(b.name)).map((o) => `<option value="${esc(o.id)}" ${sel.includes(o.id) ? "selected" : ""}>${esc(o.name)}</option>`).join("");
  }

  function renderAddWork(prefOrg) {
    S.mode = "add-work"; S.open = null;
    openDrawer(`
      <div class="drawer-head"><h3>Add work from link</h3><button class="btn small" type="button" data-act="close">Close</button></div>
      <div class="drawer-body">
        <form class="add" id="fWork">
          <label for="wUrl">Paper, project or GitHub link<input id="wUrl" type="url" required placeholder="https://arxiv.org/abs/2607.00272"></label>
          <label for="wText">Abstract or README text (optional, pasting it makes the review far more reliable)<textarea id="wText" placeholder="Paste the abstract here. Without it, Claude works from what it already knows about the link and the entry is marked as a draft."></textarea></label>
          <label for="wOrgs">Labs (hold Ctrl or Cmd to pick several)<select id="wOrgs" multiple size="5">${orgOptions(prefOrg ? [prefOrg] : [])}</select></label>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit" id="wGo" ${sample ? "" : "disabled"}>Generate summary and review</button>${sample ? "" : `<span class="note">Claude is not available in this view. Saving a link alone queues it for Claude Code.</span>`}<button class="btn" type="button" data-act="queue-only">Queue link only</button></div>
        </form>
        <div class="stream" id="wStream" hidden></div>
        <p class="err" id="wErr" hidden></p>
        <div id="wPreview"></div>
      </div>`);
  }

  function renderAddOrg() {
    S.mode = "add-org"; S.open = null;
    openDrawer(`
      <div class="drawer-head"><h3>Add lab</h3><button class="btn small" type="button" data-act="close">Close</button></div>
      <div class="drawer-body">
        <form class="add" id="fOrg">
          <label for="oName">Name<input id="oName" required placeholder="e.g. KAIST Robot Learning Lab"></label>
          <div class="grid2">
            <label for="oType">Type<select id="oType"><option value="university">University</option><option value="company">Company</option><option value="institute">Institute</option></select></label>
            <label for="oCountry">Country<input id="oCountry" placeholder="South Korea"></label>
          </div>
          <label for="oUrl">Website<input id="oUrl" type="url" placeholder="https://"></label>
          <label for="oFocus">Focus (one line)<input id="oFocus" placeholder="What the lab is known for"></label>
          <label for="oGroups">Key groups or PIs (comma separated)<input id="oGroups"></label>
          <label for="oRank">Rank (optional, lower is higher)<input id="oRank" type="number" min="1" step="1"></label>
          <button class="btn primary" type="submit">Save lab</button>
        </form>
        <p class="err" id="oErr" hidden></p>
      </div>`);
  }

  // ---------- Claude review ----------
  function reviewPrompt(url, text, orgsHint) {
    return `You review robotics research for the ANTS project and reply with JSON only.

ANTS: learn a robot manipulation skill from ONE video demonstration with a FROZEN generative model (no training), then harden it with an adversarial test loop.
- System 1 (synthesizer): perception of the demo (segmentation, hand/object keypoints, gripper aperture) -> structured DemoSpec -> a frozen code model writes a Python policy over a typed primitive API (localize, grasp, move_to, place) -> static plan gate.
- System 2 (adversary): a planner picks perturbations (pose, physics, clutter, camera, lighting, occlusion, actuation) within a severity bound, LIBERO simulation runs them, a diagnoser explains each failure; failures become constraints in the generator's context; a regression gate accepts a candidate only if it is no worse on every case seen so far; memory of past policies; escalation to a human for one targeted demo.
- Hardware: one 16 GB laptop GPU; LLM/VLM via API.

Work to review: ${url}
${orgsHint ? "Labs given by the user: " + orgsHint + "\n" : ""}${text ? "Text supplied by the user (trust this over your memory):\n\"\"\"\n" + text.slice(0, 12000) + "\n\"\"\"\n" : "No text supplied. Use only what you reliably know about this exact link. If you do not recognise it, say so in 'solves' and set confidence to 'low'. Never invent numbers.\n"}
Reply with only this JSON object:
{"title": str, "short_name": str, "year": int|null, "venue": str|null, "arxiv": "NNNN.NNNNN"|null, "github": "owner/repo"|null,
 "org_names": [str], "solves": "1-2 sentences: the problem it solves and how", "limitation": "1 sentence", "outlook": "1 sentence: what it enables next",
 "ants_blocks": [subset of ${JSON.stringify(Object.keys(BLOCKS))}],
 "ants_fit_score": 0-3 (3 = usable as an ANTS module now, 2 = useful idea or baseline, 1 = background, 0 = unrelated), "ants_fit_reason": "1 sentence",
 "gpu_note": "what hardware it needs to run, or null",
 "review": {"verdict": "meets"|"partial"|"no", "verdict_label": "short phrase", "summary": "1 sentence",
   "criteria": {${CRITERIA.map(([k]) => `"${k}": {"mark": "yes"|"partial"|"no"|"unknown", "note": "short"}`).join(", ")}}},
 "confidence": "high"|"medium"|"low"}`;
  }

  function matchOrgIds(names, picked) {
    const ids = new Set(picked);
    for (const n of names || []) {
      const k = n.toLowerCase();
      const hit = S.orgs.find((o) => o.name.toLowerCase() === k || o.id === slug(n) || k.includes(o.name.toLowerCase()) || o.name.toLowerCase().includes(k));
      if (hit) ids.add(hit.id);
    }
    return [...ids];
  }

  let draft = null, ctrl = null;
  async function generate(url, text, picked) {
    const stream = $("wStream"), err = $("wErr");
    err.hidden = true; stream.hidden = false; stream.textContent = "Asking Claude…"; $("wPreview").innerHTML = ""; $("wGo").disabled = true;
    ctrl?.abort(); ctrl = new AbortController();
    try {
      const out = await sample.json(reviewPrompt(url, text, picked.map(orgName).join(", ")), { modelTier: "default", signal: ctrl.signal, onText: ({ text }) => { stream.textContent = text.slice(-1500); } });
      if (!out || typeof out !== "object" || !out.title) throw { code: "invalid_json", message: "The reply was missing a title." };
      const id = slug(out.arxiv || out.github || out.short_name || url);
      draft = {
        id, title: String(out.title), short_name: out.short_name || null, year: Number.isInteger(out.year) ? out.year : null, venue: out.venue || null,
        arxiv: out.arxiv || null, github: out.github || null, url,
        org_ids: matchOrgIds(out.org_names, picked), orgs_display: out.org_names || [],
        solves: out.solves || "", limitation: out.limitation || "", outlook: out.outlook || "",
        ants_blocks: (out.ants_blocks || []).filter((b) => BLOCKS[b]), ants_fit_score: Math.max(0, Math.min(3, Number(out.ants_fit_score) || 0)),
        ants_fit_reason: out.ants_fit_reason || "", gpu_note: out.gpu_note || null, review: out.review || null,
        citations: null, stars: null, metrics_date: null, status: "draft", source: "in-page", confidence: out.confidence || "low",
        had_text: !!text, added_at: new Date().toISOString()
      };
      stream.hidden = true;
      $("wPreview").innerHTML = `
        <div class="sec"><h4>Draft</h4><p><b>${esc(draft.title)}</b> · ${esc(draft.year || "")} · confidence ${esc(draft.confidence)}${draft.had_text ? "" : " · from model knowledge only"}</p></div>
        <div class="sec"><h4>What it solves</h4><p>${esc(draft.solves)}</p></div>
        <div class="sec"><h4>Limitation</h4><p>${esc(draft.limitation)}</p></div>
        <div class="sec"><h4>Outlook</h4><p>${esc(draft.outlook)}</p></div>
        <div class="sec"><h4>ANTS fit</h4><p><span class="fit">${pips(draft.ants_fit_score)}${draft.ants_fit_score}</span> ${esc(draft.ants_fit_reason)}</p></div>
        ${reviewHtml(draft.review)}
        <p class="note">${draft.org_ids.length ? "Labs: " + draft.org_ids.map(orgName).map(esc).join(", ") : "No matching lab in the list. It will show under All labs."} Citations and stars fill in when Claude Code syncs the radar.</p>
        <div style="display:flex;gap:8px"><button class="btn primary" type="button" data-act="save-draft">Save to radar</button><button class="btn" type="button" data-act="discard">Discard</button></div>`;
    } catch (e) {
      stream.hidden = true; err.hidden = false;
      err.textContent = e?.code === "not_granted" ? "Claude access was declined for this page. You can still queue the link." : e?.code === "rate_limited" ? "Too many requests right now. Wait a minute, then generate again." : e?.name === "AbortError" ? "Stopped." : "Claude's reply could not be read as a review. Paste the abstract and try again, or queue the link only.";
    } finally { const b = $("wGo"); if (b) b.disabled = false; }
  }

  async function rereview(w) {
    const errEl = $("detailErr");
    try {
      const text = [w.title, w.solves, w.limitation, w.outlook].filter(Boolean).join("\n");
      const out = await sample.json(reviewPrompt(w.url || w.title, text, (w.org_ids || []).map(orgName).join(", ")), { modelTier: "default" });
      if (!out?.review) throw new Error("no review");
      await db.collection("works").doc(w.id).update({ review: out.review, ants_fit_score: Math.max(0, Math.min(3, Number(out.ants_fit_score) || 0)), ants_fit_reason: out.ants_fit_reason || w.ants_fit_reason || "" });
    } catch (e) { errEl.hidden = false; errEl.textContent = "The review could not be updated. Try again in a minute."; }
  }

  // ---------- events ----------
  document.querySelector(".seg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    S.type = b.dataset.type; S.org = null;
    document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    render();
  });
  const pickOrg = (el) => { S.org = S.org === el.dataset.org ? null : el.dataset.org; render(); };
  $("orgList").addEventListener("click", (e) => { const li = e.target.closest(".org"); if (li) pickOrg(li); });
  $("orgList").addEventListener("keydown", (e) => { const li = e.target.closest(".org"); if (li && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pickOrg(li); } });
  $("q").addEventListener("input", (e) => { S.q = e.target.value; renderRows(); });
  $("fBlock").innerHTML += Object.entries(BLOCKS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  $("fBlock").addEventListener("change", (e) => { S.block = e.target.value; renderRows(); });
  $("fFit").addEventListener("change", (e) => { S.fit = Number(e.target.value); renderRows(); });
  $("fSrc").addEventListener("change", (e) => { S.src = e.target.value; renderRows(); });
  document.querySelector("thead").addEventListener("click", (e) => {
    const th = e.target.closest("th[data-sort]"); if (!th) return;
    if (S.sort === th.dataset.sort) S.dir *= -1; else { S.sort = th.dataset.sort; S.dir = th.dataset.sort === "title" ? 1 : -1; }
    renderRows();
  });
  const openWork = (tr) => { S.open = tr.dataset.work; S.mode = null; renderRows(); renderDetail(); };
  $("rows").addEventListener("click", (e) => { const tr = e.target.closest("tr.work"); if (tr) openWork(tr); });
  $("rows").addEventListener("keydown", (e) => { const tr = e.target.closest("tr.work"); if (tr && e.key === "Enter") openWork(tr); });
  $("btnAddWork").addEventListener("click", () => renderAddWork(S.org));
  $("btnAddOrg").addEventListener("click", renderAddOrg);
  $("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("drawer").hidden) closeDrawer(); });

  function needDb(errEl) { if (db) return true; if (errEl) { errEl.hidden = false; errEl.textContent = "Saving needs the shared store, which this view cannot reach. Open the page on claude.ai while signed in."; } return false; }
  function arm(btn, label, fn) {
    if (btn.classList.contains("armed")) { fn(); return; }
    btn.classList.add("armed"); const old = btn.textContent; btn.textContent = label;
    setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = old; } }, 4000);
  }

  document.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act;
    if (act === "close" || act === "discard") { draft = null; closeDrawer(); }
    else if (act === "clear-org") { S.org = null; render(); }
    else if (act === "add-work-org") renderAddWork(S.org);
    else if (act === "del-org") {
      const o = S.orgs.find((x) => x.id === S.org); if (!o || !needDb()) return;
      arm(b, `Confirm: delete ${o.name}`, async () => {
        try { await db.collection("orgs").doc(o.id).delete(); S.org = null; } catch { b.textContent = "Delete failed. Try again."; }
      });
    }
    else if (act === "del-work") {
      const w = S.works.find((x) => x.id === S.open); if (!w || !needDb($("detailErr"))) return;
      arm(b, "Confirm: delete this work", async () => {
        try { await db.collection("works").doc(w.id).delete(); closeDrawer(); } catch { const el = $("detailErr"); el.hidden = false; el.textContent = "Delete failed. Try again."; }
      });
    }
    else if (act === "rereview") { const w = S.works.find((x) => x.id === S.open); if (w && needDb($("detailErr"))) { b.disabled = true; b.textContent = "Reviewing…"; await rereview(w); } }
    else if (act === "save-draft" && draft) {
      if (!needDb($("wErr"))) return;
      b.disabled = true;
      try { await db.collection("works").doc(draft.id).set(draft); S.open = draft.id; S.mode = null; draft = null; renderDetail(); }
      catch (err) { b.disabled = false; const el = $("wErr"); el.hidden = false; el.textContent = err?.code === "quota_exceeded" ? "The radar is full. Delete some works first." : "Saving failed. Try again."; }
    }
    else if (act === "queue-only") {
      const url = $("wUrl").value.trim(); const el = $("wErr");
      if (!safeUrl(url)) { el.hidden = false; el.textContent = "Enter a link that starts with https://"; return; }
      if (!needDb(el)) return;
      const picked = [...$("wOrgs").selectedOptions].map((o) => o.value);
      const w = { id: slug(url), title: url, url, org_ids: picked, status: "queued", source: "in-page", user_text: $("wText").value.slice(0, 12000) || null, added_at: new Date().toISOString(), ants_fit_score: null };
      try { await db.collection("works").doc(w.id).set(w); closeDrawer(); } catch { el.hidden = false; el.textContent = "Saving failed. Try again."; }
    }
  });

  document.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (e.target.id === "fWork") {
      const url = $("wUrl").value.trim();
      if (!safeUrl(url)) { const el = $("wErr"); el.hidden = false; el.textContent = "Enter a link that starts with https://"; return; }
      await generate(url, $("wText").value.trim(), [...$("wOrgs").selectedOptions].map((o) => o.value));
    } else if (e.target.id === "fOrg") {
      const el = $("oErr"); if (!needDb(el)) return;
      const name = $("oName").value.trim(); if (!name) return;
      const o = { name, type: $("oType").value, country: $("oCountry").value.trim() || null, url: safeUrl($("oUrl").value.trim()), focus: $("oFocus").value.trim() || null,
        groups: $("oGroups").value.split(",").map((s) => s.trim()).filter(Boolean), rank: $("oRank").value ? Number($("oRank").value) : null, source: "in-page", added_at: new Date().toISOString() };
      try { await db.collection("orgs").doc(slug(name)).set(o); S.org = slug(name); closeDrawer(); render(); } catch { el.hidden = false; el.textContent = "Saving failed. Try again."; }
    }
  });

  // ---------- data ----------
  render();
  const c = window.claude;
  if (!c) { $("banner").hidden = false; $("banner").textContent = "Open this page on claude.ai to load the shared radar."; loaded.orgs = loaded.works = true; render(); return; }
  c.use("sample").then((s) => { sample = s; if (S.mode === "add-work") renderAddWork(S.org); });
  c.use("db").then((d) => {
    db = d;
    if (!db) { $("banner").hidden = false; $("banner").textContent = "Sign in on claude.ai to see the shared radar."; loaded.orgs = loaded.works = true; render(); return; }
    const timer = setTimeout(() => { $("banner").hidden = false; $("banner").textContent = "The radar can't be reached yet. It will appear when the connection returns."; }, 10000);
    const ok = (snap) => { if (!snap.metadata.fromCache) { clearTimeout(timer); $("banner").hidden = true; } };
    const fail = () => { clearTimeout(timer); $("banner").hidden = false; $("banner").textContent = "The radar stopped updating. Reload the page to reconnect."; };
    db.collection("orgs").limit(1000).onSnapshot((snap) => { S.orgs = snap.docs.map((d) => ({ id: d.id, ...d.data() })); loaded.orgs = true; ok(snap); render(); }, fail);
    db.collection("works").limit(1000).onSnapshot((snap) => { S.works = snap.docs.map((d) => ({ id: d.id, ...d.data() })); loaded.works = true; ok(snap); render(); }, fail);
  });
})();
</script>
