[project]
name = "ants"
version = "0.1.0"
description = "Agentic Task Synthesis"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ants"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# generated robot programs are logged artifacts, kept byte-identical; they use the harness globals
extend-exclude = ["examples/*/policy.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
