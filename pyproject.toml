[project]
name = "ants"
version = "0.1.0"
description = "Agentic Task Synthesis"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ants"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Prompt text: hard-wrapping it would change what the model reads.
"src/ants/synthesizer/generator.py" = ["E501"]
"src/ants/evalkit/report.py" = ["E501"]
"src/ants/evalkit/system2_view.py" = ["E501"]
"src/ants/evalkit/scene_view.py" = ["E501"]
"src/ants/evalkit/contacts.py" = ["E501"]
"src/ants/orchestrator/scene_context_exp.py" = ["E501"]
"src/ants/orchestrator/a3_perception.py" = ["E501"]
"src/ants/orchestrator/a0_replay.py" = ["E501"]
"tools/aspire_launch.py" = ["E501"]
"dev/curobo/*.py" = ["E501"]
