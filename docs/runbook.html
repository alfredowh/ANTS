<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANTS Run Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky experiment rail on the left, one experiment per view: map, then its commands. */
:root{
  --bg:#eef0f3; --panel:#ffffff; --panel2:#f5f6f8; --line:#d5d9e0; --fg:#1b2230; --mute:#5c6678;
  --accent:#0b6e8a; --accent-bg:#d9edf3; --paid:#b4531a; --paid-bg:#fbe6d6; --ok:#2c7a4b; --ok-bg:#dcf0e3;
  --code-bg:#161c28; --code-fg:#e4e9f2; --code-mute:#8e99ad; --node:#ffffff; --node-dim:#e6e9ee; --edge:#a7afbd;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141c; --panel:#171d29; --panel2:#1d2433; --line:#2c3547; --fg:#e3e8f1; --mute:#93a0b6;
  --accent:#5cc3df; --accent-bg:#17394a; --paid:#f0a06a; --paid-bg:#41281a; --ok:#6fcf93; --ok-bg:#183a28;
  --code-bg:#0b0f17; --code-fg:#e4e9f2; --code-mute:#74809a; --node:#1d2433; --node-dim:#151b27; --edge:#47536a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141c; --panel:#171d29; --panel2:#1d2433; --line:#2c3547; --fg:#e3e8f1; --mute:#93a0b6;
  --accent:#5cc3df; --accent-bg:#17394a; --paid:#f0a06a; --paid-bg:#41281a; --ok:#6fcf93; --ok-bg:#183a28;
  --code-bg:#0b0f17; --code-fg:#e4e9f2; --code-mute:#74809a; --node:#1d2433; --node-dim:#151b27; --edge:#47536a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:12.5px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;padding:20px 0 14px}
header.top h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
header.top p{margin:2px 0 0;color:var(--mute);max-width:70ch}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],input[type=text],select{font:inherit;font-family:var(--mono);font-size:12.5px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);max-height:100vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
@media(max-width:860px){nav.rail{position:static;max-height:none}}
nav.rail h2{margin:10px 8px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
nav.rail button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);font:inherit;padding:7px 8px;border-radius:6px;cursor:pointer}
nav.rail button:hover{background:var(--panel2)}
nav.rail button[aria-current=true]{background:var(--accent-bg);color:var(--accent);font-weight:600}
nav.rail small{display:block;color:var(--mute);font-weight:400;font-size:11.5px}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card h2{margin:0 0 6px;font-size:17px;font-weight:600}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill.paid{background:var(--paid-bg);color:var(--paid);border-color:transparent;font-weight:600}
.pill.free{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.st{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.io{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
@media(max-width:700px){.io{grid-template-columns:minmax(0,1fr)}}
.io>div{background:var(--panel2);border-radius:6px;padding:10px;min-width:0}
.io ul{margin:0;padding-left:18px}.io li{margin:2px 0;overflow-wrap:anywhere}
.io .mid{border:1px dashed var(--line);background:none}
.map{overflow-x:auto}
.map svg{display:block;min-width:720px;width:100%;height:auto}
.node rect{fill:var(--node);stroke:var(--line);stroke-width:1}
.node text{fill:var(--fg);font:500 12px var(--sans)}
.node .sub{fill:var(--mute);font:400 10px var(--mono)}
.node.dim{opacity:.38}
.node.hit rect{fill:var(--accent-bg);stroke:var(--accent);stroke-width:1.5}
.node.hit text{fill:var(--accent)}
.node.sel rect{stroke:var(--fg);stroke-width:2}
.node{cursor:pointer}
.edge{stroke:var(--edge);stroke-width:1.2;fill:none}
.edge.hit{stroke:var(--accent);stroke-width:1.6}
.edge.dim{opacity:.25}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:12px;margin-top:6px}
.mod{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.mod dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:4px 12px;margin:8px 0 0}
.mod dt{color:var(--mute)}.mod dd{margin:0;overflow-wrap:anywhere}
.cmd{display:flex;flex-direction:column;gap:10px}
.cmd header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;justify-content:space-between}
.cmd h2{font-size:15px;margin:0}
.cmd .id{font-family:var(--mono);font-size:12px;color:var(--mute)}
.cmd p{margin:0;color:var(--fg);max-width:90ch}
.args{display:grid;grid-template-columns:auto minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,2.4fr);gap:4px 10px;align-items:center;font-size:12.5px}
.args .h{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.args .flag{font-family:var(--mono);overflow-wrap:anywhere}
.args .desc{color:var(--mute);overflow-wrap:anywhere}
.args input[type=text],.args select{width:100%}
.argwrap{overflow-x:auto}
@media(max-width:700px){.args{grid-template-columns:auto minmax(0,1fr)}.args .h{display:none}.args .desc{grid-column:1/-1;margin-bottom:6px}.args .val{grid-column:1/-1}}
.term{position:relative;background:var(--code-bg);border-radius:6px}
.term pre{margin:0;padding:12px 84px 12px 14px;color:var(--code-fg);font:12.5px/1.55 var(--mono);overflow-x:auto;white-space:pre}
.btn{font:inherit;font-size:12px;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:4px 10px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.copy{position:absolute;top:8px;right:8px;background:#26304a;border-color:#3a4766;color:#dbe4f5}
.copy:hover{background:#2f3b5c;color:#fff;border-color:#5c6e99}
.copy.done{background:#245c3d;border-color:#2f7a50;color:#fff}
.ex summary{cursor:pointer;color:var(--accent);font-size:12.5px}
.ex .term{margin-top:8px}.ex .cap{margin:10px 0 0;font-size:12.5px;color:var(--mute)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mute);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--panel2);color:var(--mute);border-radius:4px;padding:1px 6px;cursor:pointer}
.chip:hover{color:var(--accent);border-color:var(--accent)}
.note{font-size:12.5px;color:var(--mute)}
.warn{background:var(--paid-bg);color:var(--paid);border-radius:6px;padding:8px 10px;font-size:12.5px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>ANTS Run Book</h1>

  </header>
  <div class="grid">

    <main id="main"></main>
  </div>
</div>

d-only for ANTS: outputs go to ANTS/data/. The exact invocation of the first extraction is reconstructed from smoke-2026-10-31.md §3; check hurobo's own README if a path differs.", "examples": [], "modules": ["hurobo"], "in": ["clips *.mp4", "setup yaml", "intrinsics"], "out": ["demos *.npz", "summary.json"], "cost": "free", "minutes": 5, "doc": "docs/results.md"}, {"id": "demo.hurobo", "title": "hurobo demo (.npz) to DemoSpec JSON", "group": "demos", "runner": "hurobo", "base": "tools/hurobo_demospec.py data/hurobo_e1/demos_marker_0.06/20261016_233832.npz", "args": [{"flag": "--setup", "value": "hurobo/data/raw/setup_01/measurements.yaml", "kind": "value", "on": true, "required": true, "desc": "measurements.yaml of the recording setup."}, {"flag": "--out", "value": "data/demospecs/hurobo_233832.json", "kind": "value", "on": true, "required": true, "desc": "DemoSpec JSON to write; also prints the summary block the prompt uses."}], "description": "Uses hurobo's Python (numpy); ANTS does not depend on numpy. Distances are given in metres and as fractions of object radius.", "examples": [{"title": "Clip 233859", "cmd": "hurobo/.venv/bin/python -I tools/hurobo_demospec.py data/hurobo_e1/demos_marker_0.06/20261016_233859.npz --setup hurobo/data/raw/setup_01/measurements.yaml --out data/demospecs/hurobo_233859.json"}, {"title": "Clip 234314", "cmd": "hurobo/.venv/bin/python -I tools/hurobo_demospec.py data/hurobo_e1/demos_marker_0.06/20261016_234314.npz --setup hurobo/data/raw/setup_01/measurements.yaml --out data/demospecs/hurobo_234314.json"}, {"title": "Clip 234603", "cmd": "hurobo/.venv/bin/python -I tools/hurobo_demospec.py data/hurobo_e1/demos_marker_0.06/20261016_234603.npz --setup hurobo/data/raw/setup_01/measurements.yaml --out data/demospecs/hurobo_234603.json"}], "modules": ["demospec_tools", "hurobo"], "in": ["demo .npz", "setup yaml"], "out": ["data/demospecs/*.json"], "cost": "free", "minutes": 0, "doc": "tools/hurobo_demospec.py"}, {"id": "demo.libero", "ti pped one."}, {"flag": "--arms", "value": "nodemo,demo", "kind": "value", "on": false, "choices": ["nodemo,demo", "demo", "nodemo"], "desc": "Arms to run. They differ only in the demo section of the prompt."}, {"flag": "--temperatures", "value": "0.2,0.7", "kind": "value", "on": true, "desc": "One sample per temperature. Default 0.2,0.7,0.5,1.0; exp01 used 0.2,0.7."}, {"flag": "--repairs", "value": "2", "kind": "value", "on": true, "desc": "Max repairs from text feedback. Default 4; exp01 used 2."}, {"flag": "--scenes", "value": "stock", "kind": "value", "on": true, "choices": ["stock", "stock,scaled", "scaled"], "desc": "Scenes each final program is evaluated in. Default stock,scaled."}, {"flag": "--debug-scene", "value": "stock", "kind": "value", "on": false, "choices": ["stock", "scaled"], "desc": "Scene where programs are debugged and repaired (must be one of --scenes)."}, {"flag": "--eval-seeds", "value": "51,52,53,54,55", "kind": "value", "on": false, "desc": "Acceptance seeds for the final evaluation. Empty string skips evaluation. Never use held-out seeds here."}, {"flag": "--debug-seed", "value": "51", "kind": "value", "on": false, "desc": "Seed where programs are debugged."}, {"flag": "--explain", "kind": "switch", "on": false, "desc": "Repair replies start with a WHY: rationale (the API returns no reasoning text)."}, {"flag": "--model", "value": "muse-wonder-1.0", "kind": "value", "on": false, "choices": ["muse-wonder-1.0", "muse-spark-1.3", "muse-spark-1.2", "muse-spark-1.1"], "desc": "Generator model on the Meta API."}, {"flag": "--token-budget", "value": "600000", "kind": "value", "on": false, "desc": "HARD cap on NEW (uncached) tokens in this run. About $8 at $13.5 per M tokens. Cached calls are free."}, {"flag": "--usd-per-mtok", "value": "13.5", "kind": "value", "on": false, "desc": "Only for the cost estimate."}, {"flag": "--suite", "value": "libero_goal_swap", "kind": "value", "on": false, "desc": "LIBERO suite."}, {"flag": "--task-id", "value": "8 md"}, {"id": "exp03.run", "title": "Exp 03: explain-then-repair for one clip", "group": "experiments", "runner": "ants", "paid": true, "base": "-m ants.orchestrator.demo_vs_nodemo --aspire ASPIRE --arms demo --temperatures 0.2 --explain --debug-scene scaled --scenes stock,scaled --eval-seeds \"\"", "args": [{"flag": "--demospec", "value": "data/demospecs/hurobo_233859.json", "kind": "value", "on": true, "required": true, "choices": ["data/demospecs/hurobo_233832.json", "data/demospecs/hurobo_233859.json", "data/demospecs/hurobo_234314.json"], "desc": "Clip to use. Exp 03 ran 233832, 233859 and 234314."}, {"flag": "--out", "value": "data/runs/exp03_explain/clip_233859", "kind": "value", "on": true, "required": true, "desc": "One run dir per clip."}, {"flag": "--token-budget", "value": "250000", "kind": "value", "on": true, "desc": "Per-clip cap used in exp03."}, {"flag": "--repairs", "value": "4", "kind": "value", "on": false, "desc": "Default 4."}], "description": "Reconstructed from the run's config.json (arms demo, temperature 0.2, --explain, debug scene scaled, no evaluation seeds). Clip 233859 attempt 2 is the case that stalls on the wine rack.", "examples": [{"title": "All three clips", "cmd": "for c in 233832 233859 234314; do uv run python -m ants.orchestrator.demo_vs_nodemo --aspire ASPIRE --demospec data/demospecs/hurobo_$c.json --out data/runs/exp03_explain/clip_$c --arms demo --temperatures 0.2 --explain --debug-scene scaled --scenes stock,scaled --eval-seeds \"\" --token-budget 250000; done"}], "modules": ["orch_exp", "generator", "llm", "muse", "rollout", "launcher", "aspire", "evalkit"], "in": ["DemoSpec JSON"], "out": ["data/runs/exp03_explain/clip_<id>/"], "cost": "up to 250k tokens per clip", "minutes": 45, "doc": "docs/results.md"}, {"id": "exp04.prep", "title": "Exp 04 step 1: settle and dump every scene level", "group": "experiments", "runner": "ants", "base": "-m ants.orchestrator.scene_context_exp --aspire ASPIRE --prep", "args": [{"flag": "--out", "value": "data/runs/exp04_scene", "kind": "value", "on": true, "required": true, "desc": "Run dir."}, {"flag": "--levels-file", "value": "data/scenes/levels.json", "kind": "value", "on": false, "desc": "Scene level definitions (L1-L3)."}, {"flag": "--levels", "value": "L1,L2,L3", "kind": "value", "on": false, "desc": "Levels to prepare."}], "description": "Simulation only, no model call. Dumps the settled scene (poses, geoms, exact gaps) of each level, then stops.", "examples": [], "modules": ["orch_exp", "scene_world", "launcher", "aspire", "services"], "in": ["levels.json"], "out": ["data/scenes/L*/ scene dumps"], "cost": "free", "minutes": 5, "doc": "docs/results.md"}, {"id": "exp04.dry", "title": "Exp 04 step 2: write the prompts only", "group": "experiments", "runner": "ants", "base": "-m ants.orchestrator.scene_context_exp --aspire ASPIRE --dry-run", "args": [{"flag": "--out", "value": "data/runs/exp04_scene", "kind": "value", "on": true, "required": true, "desc": "Run dir; prompts go to <out>/prompts/."}, {"flag": "--groups", "value": "G,E", "kind": "value", "on": false, "choices": ["G,E", "G", "E"], "desc": "G = first-program variants, E = repair-evidence variants."}, {"flag": "--g-variants", "value": "S0,S1,S2,S3,S4,SP", "kind": "value", "on": false, "desc": "Scene-description variants (SP is the placebo)."}, {"flag": "--e-variants", "value": "E0,E1,E2,E3,EP", "kind": "value", "on": false, "desc": "Repair-evidence variants (EP is the placebo)."}, {"flag": "--levels", "value": "L1,L2,L3", "kind": "value", "on": false, "desc": "Scene levels."}], "description": "No model call and no simulation: prints the size of each changing prompt part. Do this to inspect what the model will read before spending tokens.", "examples": [], "modules": ["orch_exp", "generator", "scene_world"], "in": ["levels.json", "demospec"], "out": ["<out>/prompts/*.txt"], "cost": "free", "minutes": 1, "doc": "docs/results.md"}, {"id": "exp04.run", "title": "Exp 04 step 3: run the scene-context experiment", "group": "experiments", "runner": "ants", "paid": true, "base": "-m ants.orchestrator.scene_context_exp --aspire ASPIRE", "args": [{"flag": "--out", "value": "data/runs/exp04_scene", "kind": "value", "on": true, "required": true, "desc": "Run dir. Finished cells are kept on re-run (sample-level resume); every call is cached."}, {"flag": "--groups", "value": "G,E", "kind": "value", "on": false, "choices": ["G,E", "G", "E"], "desc": "G (first program) and/or E (one repair)."}, {"flag": "--levels", "value": "L1,L2,L3", "kind": "value", "on": false, "choices": ["L1,L2,L3", "L1", "L2", "L3", "L1,L2"], "desc": "Scene levels for group G."}, {"flag": "--g-variants", "value": "S0,S1,S2,S3,S4,SP", "kind": "value", "on": false, "desc": "Scene description in the first prompt: S0 none, S1 positions, S2 +extents, S3 +relations, S4 combined, SP placebo."}, {"flag": "--e-variants", "value": "E0,E1,E2,E3,EP", "kind": "value", "on": false, "desc": "Repair evidence: E0 none, E1 +contact log, E2 +scene, E3 +stall readings, EP placebo."}, {"flag": "--demospec", "value": "data/demospecs/hurobo_233859.json", "kind": "value", "on": false, "desc": "Clip used for the demo summary."}, {"flag": "--levels-file", "value": "data/scenes/levels.json", "kind": "value", "on": false, "desc": "Level definitions."}, {"flag": "--temperature", "value": "0.2", "kind": "value", "on": false, "desc": "Sampling temperature."}, {"flag": "--model", "value": "muse-wonder-1.0", "kind": "value", "on": false, "choices": ["muse-wonder-1.0", "muse-spark-1.3"], "desc": "Generator."}, {"flag": "--token-budget", "value": "900000", "kind": "value", "on": true, "desc": "HARD cap on NEW tokens (about $12 at $13.5/M)."}, {"flag": "--debug-seed", "value": "51", "kind": "value", "on": false, "desc": "Seed for the rollouts."}], "description": "One run per cell, so differences can be luck. The scene given to the model is simulator truth (oracle). SPENDS MUSE TOKENS. The original run was done in chunks (see examples) so a limit never loses work.", "examples": [{"title": "First program, level 1 only", "cmd": "uv run python -m ants.orchestrator.scene_context_exp --aspire ASPIRE --out data/runs/exp04_scene --groups G --levels L1"}, {"title": "Repair-evidence group only", "cmd": "uv run python -m ants.orchestrator.scene_context_exp --aspire ASPIRE --out data/runs/exp04_scene --groups E"}, {"title": "Level 2 and 3 first-program variants", "cmd": "uv run python -m ants.orchestrator.scene_context_exp --aspire ASPIRE --out data/runs/exp04_scene --groups G --levels L2,L3"}, {"title": "Cheapest useful cell: placebo vs full scene, level 2", "cmd": "uv run python -m ants.orchestrator.scene_context_exp --aspire ASPIRE --out data/runs/exp04_scene --groups G --levels L2 --g-variants S0,S4,SP --token-budget 200000"}], "modules": ["orch_exp", "scene_world", "generator", "llm", "muse", "rollout", "launcher", "aspire", "services", "evalkit"], "in": ["data/scenes/levels.json", "exp03 program_attempt2.py", "services up", "META_API_KEY"], "out": ["<out>/G-<variant>/ and E-<variant>/ (prompt, reply, program, contacts.jsonl, overlay.json, run dir)", "scenes/", "config.json", "events.jsonl"], "cost": "30-65k tokens per cell; default cap 900k", "minutes": 120, "doc": "docs/results.md"}, {"id": "report.run", "title": "View a run (HTML trace UI)", "group": "viewer", "runner": "ants", "base": "-m ants.evalkit.report data/runs/exp04_scene", "args": [{"flag": "--open", "kind": "switch", "on": true, "desc": "Open report.html in the browser."}, {"flag": "--serve", "kind": "switch", "on": false, "desc": "Serve the run directory over http so videos play (127.0.0.1)."}, {"flag": "--port", "value": "8765", "kind": "value", "on": false, "desc": "Port for --serve."}], "description": "Writes one self-contained report.html in the run dir: success rates with intervals, seed-by-sample heatmap, rollout explorer with video, compare, policies, System 2 and Scene tabs. Keep report.html in the folder (videos are linked by relative path). Works on any run dir and on data/runs itself.", "examples": [{"title": "All runs, pick in the UI", "cmd": "uv run python -m ants.evalkit.report data/runs --open"}, {"title": "Exp 02 over http", "cmd": "uv run python -m ants.evalkit.report data/runs/exp02_scaled --serve --open"}], "modules": ["evalkit"], "in": ["data/runs/<name>/"], "out": ["report.html"], "cost": "free", "minutes": 0, "doc": "src/ants/evalkit/report.py"}, {"id": "report.all", "title": "View all runs (incl. synthetic System 2 mock)", "group": "viewer", "runner": "ants", "base": "-m ants.evalkit.report data/runs --open", "args": [], "description": "Opens the run selector.", "examples": [], "modules": ["evalkit"], "in": ["data/runs/"], "out": ["data/runs/report.html"], "cost": "free", "minutes": 0}, {"id": "perturb.run", "title": "Run a program under a perturbation", "group": "perturbations", "runner": "libero", "where": "cd ASPIRE", "base": "../tools/aspire_launch.py ../data/runs/perturb_preview/friction04.json -- run", "args": [{"flag": "--benchmark", "value": "libero-pro", "kind": "value", "on": true, "desc": "cap-harness benchmark."}, {"flag": "--suite", "value": "libero_goal_swap", "kind": "value", "on": true, "required": true, "desc": "LIBERO suite."}, {"flag": "--task-id", "value": "8", "kind": "value", "on": true, "required": true, "desc": "8 = put the bowl on the plate."}, {"flag": "--seed", "value": "51", "kind": "value", "on": true, "desc": "Acceptance seeds 51-65, held-out 1-50."}, {"flag": "--init-mode", "value": "seeded", "kind": "value", "on": true, "choices": ["seeded", "saved"], "desc": "ALWAYS seeded: 'saved' maps seed to (seed-1) % 50, so seed 51 equals seed 1."}, {"flag": "--program", "value": "PATH/program.py", "kind": "value", "on": true, "required": true, "desc": "The program under test, e.g. a program_attemptK.py from a run dir."}, {"flag": "--output-root", "value": "../data/runs/perturb_preview/out", "kind": "value", "on": true, "desc": "Where the run dir goes."}, {"flag": "--max-steps", "value": "2000", "kind": "value", "on": true, "desc": "Episode length in control ticks."}, {"flag": "--camera-width", "value": "800", "kind": "value", "on": true, "desc": "Camera width."}, {"flag": "--camera-height", "value": "512", "kind": "value", "on": true, "desc": "Camera height."}, {"flag": "--no-videos", "kind": "switch", "on": false, "desc": "Skip mp4 capture (faster)."}, {"flag": "--flat-run-dir", "kind": "switch", "on": false, "desc": "Write <output-root>/<seed>/<run-id> instead of nesting."}], "description": "The launcher applies the perturbation after every reset and on every step, then hands over to ASPIRE's normal CLI. Everything after `--` goes to `cap-harness run`. The program cannot see the perturbation. Edit the first argument to pick a spec.", "examples": [{"title": "Friction x0.4 on the bowl (spec)", "cmd": "{\"physics\": {\"friction_scale\": 0.4, \"bodies\": [\"bowl\"]}}"}, {"title": "Bowl shifted +4 cm x, -3 cm y (spec)", "cmd": "{\"pose\": {\"offsets_m\": {\"akita_black_bowl_1_joint0\": [0.04, -0.03]}}}"}, {"title": "Actuation noise + 2-step latency (spec)", "cmd": "{\"actuation\": {\"noise_std\": 0.01, \"latency_steps\": 2, \"seed\": 0}}"}, {"title": "Camera + lighting (spec)", "cmd": "{\"camera\": {\"name\": \"agentview\", \"pos_offset_m\": [0.0, 0.02, 0.0], \"fovy_delta_deg\": 2.0}, \"lighting\": {\"diffuse_scale\": 0.6}}"}], "modules": ["launcher", "rollout", "aspire", "services", "planner"], "in": ["perturbation.json", "program.py"], "out": ["<output-root> run dir (outcome.json, episode/, trace/, videos)"], "cost": "free (simulation only)", "minutes": 2, "doc": "tools/aspire_launch.py"}, {"id": "perturb.scale", "title": "Real-size scene (bowl x1.227, plate x1.855)", "group": "perturbations", "runner": "libero", "where": "cd ASPIRE", "base": "../tools/aspire_launch.py ../data/scaled_test/scale.json -- run", "args": [{"flag": "--suite", "value": "libero_goal_swap", "kind": "value", "on": true, "desc": "Suite."}, {"flag": "--task-id", "value": "8", "kind": "value", "on": true, "desc": "Task."}, {"flag": "--seed", "value": "51", "kind": "value", "on": true, "desc": "Seed 51-55 used."}, {"flag": "--init-mode", "value": "seeded", "kind": "value", "on": true, "desc": "Always seeded."}, {"flag": "--program", "value": "PATH/program.py", "kind": "value", "on": true, "required": true, "desc": "Program."}, {"flag": "--output-root", "value": "../data/scaled_test/out", "kind": "value", "on": true, "desc": "Output."}], "description": "scale.json = {\"scale\": {\"bodies\": {\"akita_black_bowl_1_main\": 1.227, \"plate_1_main\": 1.855}}}. The scene is rebuilt after every reset and LIBERO's 0.03 m on-top tolerance grows with the target's factor. Placement overlap is NOT re-checked (experimental).", "examples": [{"title": "Remove an object's collisions (diagnosis only)", "cmd": "{\"ablate\": {\"bodies\": [\"wine_rack\"]}}"}], "modules": ["launcher", "aspire"], "in": ["scale.json", "program.py"], "out": ["run dir"], "cost": "free", "minutes": 2, "doc": "docs/results.md"}, {"id": "perturb.contacts", "title": "Log every MuJoCo contact of a run", "group": "perturbations", "runner": "libero", "where": "cd ASPIRE", "base": "../tools/aspire_launch.py ../data/evidence/contacts_spec.json -- run", "args": [{"flag": "--suite", "value": "libero_goal_swap", "kind": "value", "on": true, "desc": "Suite."}, {"flag": "--task-id", "value": "8", "kind": "value", "on": true, "desc": "Task."}, {"flag": "--seed", "value": "51", "kind": "value", "on": true, "desc": "Seed."}, {"flag": "--init-mode", "value": "seeded", "kind": "value", "on": true, "desc": "Always seeded."}, {"flag": "--program", "value": "PATH/program.py", "kind": "value", "on": true, "required": true, "desc": "Program."}], "description": "Spec: {\"scale\": {...}, \"contacts\": {\"path\": \"run/contacts.jsonl\"}}. Read-only evidence: one JSON line per env step, plus <stem>_scene.json (every body pose, geom, exact gaps) after dump_at_step (default 6) and _scene_reset.json. Feeds ants.evalkit.contacts and the Scene tab.", "examples": [{"title": "Spec", "cmd": "{\"scale\": {\"bodies\": {\"akita_black_bowl_1_main\": 1.227, \"plate_1_main\": 1.855}}, \"contacts\": {\"path\": \"../data/evidence/run/contacts.jsonl\"}}"}], "modules": ["launcher", "scene_world", "evalkit"], "in": ["spec with contacts key"], "out": ["contacts.jsonl", "*_scene.json"], "cost": "free", "minutes": 2, "doc": "tools/aspire_launch.py"}, {"id": "test.system2", "title": "Tests for the System 2 loop, gate, planner", "group": "system2", "runner": "shell", "base": "uv run pytest tests/orchestrator tests/adversary -q", "args": [], "description": "harden() has no CLI; its behaviour is exercised here with fake run_case and generate callables.", "examples": [], "modules": ["system2", "planner", "diagnoser"], "in": [], "out": ["pass/fail"], "cost": "free", "minutes": 1}, {"id": "curobo.service", "title": "cuRobo service (dev): carve margin and attached held object", "group": "dev-curobo", "runner": "curobo", "where": "cd ASPIRE", "env": "ANTS_CARVE_MARGIN_M=0.0 ANTS_ATTACH_FILE=$PWD/../data/runs/curobo/attach.json", "base": "../dev/curobo/service_dev.py", "args": [{"flag": "--port", "value": "8118", "kind": "value", "on": true, "desc": "Service port (stock cuRobo port)."}], "description": "Stock service deletes every scene point within 5 cm of the robot spheres, so an obstacle next to the gripper is invisible. ANTS_CARVE_MARGIN_M replaces that (default here 0.02). Stop the supervised cuRobo first. Since 2026-11-02 it also uses dev/curobo/franka_attach.yml (64 sphere slots on the attached_object link) and reads the spheres to attach from $ANTS_ATTACH_FILE before every plan (written by tools/aspire_launch.py, planner.attach). Exp06 to 08 ran with ANTS_CARVE_MARGIN_M=0.0, which the service turns into max(voxel 0.01 m, 0.0) = 1 cm, not the 2 cm the doc first stated.", "examples": [{"title": "Stock margin for comparison", "cmd": "ANTS_CARVE_MARGIN_M=0.05 ASPIRE/.venv-curobo/bin/python dev/curobo/service_dev.py --port 8118"}], "modules": ["curobo_dev", "services"], "in": [], "out": ["cuRobo HTTP service"], "cost": "free", "minutes": 1, "doc": "dev/curobo/README.md"}, {"id": "curobo.contact", "title": "Run with per-step contact log + robot mask", "group": "dev-curobo", "runner": "libero", "where": "cd ASPIRE", "env": "ANTS_CONTACT_LOG=../data/evidence/out.jsonl", "base": "../dev/curobo/contact_launch.py scene.json -- run --benchmark libero-pro --suite libero_goal_swap --task-id 8 --seed 51 --init-mode seeded --program ../dev/curobo/programs/exp3_a2_orbit.py", "args": [{"flag": "ANTS_ROBOT_MASK=", "value": "sam3", "kind": "env", "on": false, "choices": ["1", "sam3"], "desc": "Env: build the planning cloud from non-robot pixels. 1 = simulator segmentation (privileged); sam3 = SAM3 prompts 'robot arm' and 'robot gripper'."}, {"flag": "ANTS_EXCLUDE_RADIUS_M=", "value": "0.12", "kind": "env", "on": false, "desc": "Env: drop scene points within r of the manipulated object."}, {"flag": "ANTS_CLOUD_DIR=", "value": "../data/evidence/clouds", "kind": "env", "on": false, "desc": "Env: dump every planning cloud (input to carve_check, carve_curve, probe_goal)."}, {"flag": "ANTS_PROBE_XYZ=", "value": "0.477,-0.175,0.237", "kind": "env", "on": false, "desc": "Env: print per scene body how close its points get to this goal."}, {"flag": "ANTS_ONTOP_TEST=", "value": "../data/evidence/ontop.json", "kind": "env", "on": false, "desc": "Env: drop the bowl on the plate and record what the on-top check sees."}], "description": "tools/aspire_launch.py plus a per-step contact log. The env switches are prefixed to the command (set the ones you need). scene.json is a launcher spec such as scale.json. Programs under dev/curobo/programs/: exp3_a2_curobo_all.py (cuRobo on every move), exp3_a2_orbit.py (scene-aware transit + orbit skill). cuRobo service must be up for these.", "examples": [], "modules": ["curobo_dev", "launcher", "aspire", "services"], "in": ["scene.json", "program.py"], "out": ["contact log JSONL", "run dir"], "cost": "free", "minutes": 3, "doc": "dev/curobo/README.md"}, {"id": "curobo.validate", "title": "No-forbidden-collision validator", "group": "dev-curobo", "runner": "shell", "base": "python3 dev/curobo/collision_validator.py data/evidence/exp03_233859_a2", "args": [], "description": "Second success validator: reads the contact log of each RUN_DIR and flags every step with a forbidden contact (robot with anything but the bowl; bowl with anything but plate, table or robot). Clean success = task check passed and nothing flagged. Pass several run dirs to compare.", "examples": [{"title": "Several runs", "cmd": "python3 dev/curobo/collision_validator.py RUN_A RUN_B RUN_C"}], "modules": ["curobo_dev"], "in": ["run dir with contacts"], "out": ["flagged-step summary"], "cost": "free", "minutes": 0, "doc": "dev/curobo/README.md"}, {"id": "curobo.carve-check", "title": "Does the carve erase the obstacle?", "group": "dev-curobo", "runner": "curobo", "where": "cd ASPIRE", "base": "../dev/curobo/carve_check.py CLOUD.npy TRACE_CALLS_DIR CALL_ID 0.477 -0.175 0.237", "args": [], "description": "Replays the robot carve on a dumped planning cloud (needs the GPU) and reports what survives near a contact point X Y Z (robot base frame).", "examples": [], "modules": ["curobo_dev"], "in": ["cloud .npy", "trace calls dir", "call id", "X Y Z"], "out": ["points before/after"], "cost": "free", "minutes": 1, "doc": "dev/curobo/README.md"}, {"id": "curobo.carve-curve", "title": "Sweep the carve margin", "group": "dev-curobo", "runner": "curobo", "where": "cd ASPIRE", "base": "../dev/curobo/carve_curve.py CLOUD.npy TRACE_CALLS_DIR CALL_ID 0.477 -0.175 0.237", "args": [], "description": "Same replay as carve_check, over a range of margins (stock is 5 cm); prints JSON.", "examples": [], "modules": ["curobo_dev"], "in": ["cloud .npy", "trace calls dir", "call id", "X Y Z"], "out": ["JSON: surviving points per margin"], "cost": "free", "minutes": 1, "doc": "dev/curobo/README.md"}, {"id": "curobo.probe", "title": "Which scene points make a goal infeasible?", "group": "dev-curobo", "runner": "shell", "base": "python3 dev/curobo/probe_goal.py CLOUD.npy TRACE_CALLS_DIR 0.477 -0.175 0.237", "args": [], "description": "Re-plans the last curobo_plan_to_joints call with parts of the cloud removed. Needs requests and numpy and the cuRobo service on 8118. Use ASPIRE's cuRobo python if numpy is missing.", "examples": [], "modules": ["curobo_dev", "services"], "in": ["cloud .npy", "trace calls dir", "X Y Z"], "out": ["feasibility per removed region"], "cost": "free", "minutes": 2, "doc": "dev/curobo/README.md"}, {"id": "curobo.ontop", "title": "What does LIBERO's on-top check see?", "group": "dev-curobo", "runner": "shell", "base": "echo 'run curobo.contact with ANTS_ONTOP_TEST=out.json (ontop_test.py is called by contact_launch.py)'", "args": [], "description": "ontop_test.py has no CLI of its own; set ANTS_ONTOP_TEST in curobo.contact.", "examples": [], "modules": ["curobo_dev"], "in": [], "out": ["ontop.json"], "cost": "free", "minutes": 0, "doc": "dev/curobo/README.md"}, {"id": "exp05.probe", "title": "Exp 05 step 1: perceive the L1 start state (SAM 3, two arm poses)", "group": "exp05", "runner": "ants", "base": "-m ants.orchestrator.perceived_scene --probe", "args": [{"flag": "--out", "value": "data/runs/exp05_perceived_scene", "kind": "value", "on": true, "required": true, "desc": "Run dir."}, {"flag": "--aspire", "value": "ASPIRE", "kind": "value", "on": true, "desc": "ASPIRE checkout (services sam3 and pyroki must run)."}], "description": "Simulation and SAM 3 only, no model call. Writes perception_start.json and perception_arm.json (all masks of 13 prompts in both cameras). The committed results come from the same probes run by hand earlier (probe_L1 and probe_L1_arm/run2).", "examples": [{"title": "Run it", "cmd": "uv run python -m ants.orchestrator.perceived_scene --aspire ASPI ,exp10,exp11"], "desc": "exp06: no scene text, WHY only. exp07: S4 from perception + E3 evidence. exp08: S4 from the simulator + E3, simulator robot mask. exp09 to exp11 repeat exp06 to 08 with the held bowl attached to the hand (known bowl size) and save the planning clouds."}, {"flag": "--token-budget", "value": "250000", "kind": "value", "on": true, "desc": "Per run (3 arms per experiment: clip 233859, clip 233832, no demo). Up to 9 runs, about 30 USD at the high end."}, {"flag": "--arms", "value": "clip_233859,clip_233832,nodemo", "kind": "value", "on": false, "desc": "Subset of arms."}, {"flag": "--total-token-budget", "kind": "value", "on": false, "desc": "Stop starting new runs once this many NEW tokens were spent in this command (counted from data/llm_ledger.jsonl). Default: no total cap."}, {"flag": "--arm-major", "kind": "switch", "on": false, "desc": "Loop arms outside and experiments inside, so a stop leaves comparable arms."}, {"flag": "--print", "kind": "switch", "on": false, "desc": "Print the demo_vs_nodemo commands and stop."}], "description": "Needs the ASPIRE services (SAM 3, PyRoki) and the dev cuRobo service (dev/curobo/service_dev.py, port 8118). Runs write to data/runs/curobo/<exp>/<arm>/. Success is the footprint rule (half of the bowl inside the plate); a clean success also has no blocking contact. Repeat the command to resume.", "examples": [{"title": "Overnight, all three", "cmd": "uv run python -m ants.orchestrator.exp_curobo --exp exp06,exp08,exp07 --token-budget 250000"}, {"title": "Show the commands only", "cmd": "uv run python -m ants.orchestrator.exp_curobo --exp exp07 --print"}, {"title": "Exp 09 to 11, attach the held bowl", "cmd": "uv run python -m ants.orchestrator.exp_curobo --exp exp09,exp10,exp11 --token-budget 250000"}], "modules": ["orch_exp", "generator", "llm", "muse", "rollout", "launcher", "aspire", "services", "evalkit"], "in": ["DemoSpec JSON", "data/runs/exp05_perceived_scene/s4_*.txt"], "out": ["data/runs/curobo/<exp>/<arm>/"], "cost": "up to 250k tokens per run, 9 runs", "minutes": 600, "doc": "docs/results.md"}, {"id": "curobo.viewer", "title": "Build the cuRobo plan viewer for one run attempt", "group": "dev-curobo", "runner": "shell", "where": "cd to the ANTS repo root", "base": "PYTHONPATH=src ASPIRE/.venv-libero/bin/python dev/curobo/make_viewer.py", "args": [{"flag": "data/runs/curobo/exp09/clip_233859", "kind": "value", "on": true, "required": true, "desc": "Run folder (needs --save-clouds, on by default in exp09 to exp11). Passed as the first argument."}, {"flag": "--attempt", "value": "4", "kind": "value", "on": false, "desc": "Attempt to replay; default the last."}], "description": "Replays every cuRobo plan call of one attempt (cloud, robot spheres, straight vs planned path, before/after attaching the bowl by my own collision check) and writes <run>/plan_viewer/index.html and plans2d.html. View it in the run viewer's Doc tab: uv run python -m ants.evalkit.report data/runs/curobo --serve --open", "examples": [{"title": "All three arms of exp09, last attempt", "cmd": "for a in clip_233859 clip_233832 nodemo; do PYTHONPATH=src ASPIRE/.venv-libero/bin/python dev/curobo/make_viewer.py data/runs/curobo/exp09/$a; done"}], "modules": ["curobo_dev", "evalkit"], "in": ["data/runs/curobo/<exp>/<arm>/*/sample0/debug_attempt*/clouds"], "out": ["data/runs/curobo/<exp>/<arm>/plan_viewer/"], "cost": "free", "minutes": 2, "doc": "dev/curobo/make_viewer.py"}, {"id": "exp12.demo", "title": "Demo vs no demo, demo arm: demo + S4 + E3 on cuRobo", "group": "experiments", "runner": "ants", "paid": true, "base": "-m ants.orchestrator.demo_vs_nodemo", "args": [{"flag": "--aspire", "value": "ASPIRE", "kind": "value", "on": true, "required": true, "desc": "ASPIRE checkout."}, {"flag": "--out", "value": "data/runs/demo_e3_s4_sim", "kind": "value", "on": true, "required": true, "desc": "Run folder. Repeat the same --out to resume."}, {"flag": "--demospec", "value": "data/demospecs/hurobo_233859. unner": "shell", "base": "/storyline-judge  # then the storyline text or a storyline_id", "args": [], "description": "Reviews a hackathon storyline against the current code and runs. Writes to the Storyline tab. Instructions: .claude/skills/storyline-judge/SKILL.md.", "examples": [], "modules": [], "in": ["storyline text"], "out": ["artifact db: storyline"], "cost": "agent time", "minutes": 5, "doc": ".claude/skills/storyline-judge/SKILL.md"}, {"id": "skill.radar", "title": "/robot-research-radar (refresh, extend, sync)", "group": "agent-skills", "runner": "shell", "base": "/robot-research-radar  # refresh | extend | sync | re-rank", "args": [], "description": "Maintains the Robot Research Radar artifact. Instructions: .claude/skills/robot-research-radar/SKILL.md.", "examples": [], "modules": ["radar"], "in": ["links queued on the page"], "out": ["artifact db: orgs, works"], "cost": "agent time", "minutes": 20, "doc": ".claude/skills/robot-research-radar/SKILL.md"}, {"id": "scene_recon.scan", "title": "Orbit-scan a LIBERO scene (RGB-D + camera pose per frame)", "group": "scene-recon", "runner": "libero", "base": "../tools/mapper_probe/scan_orbit.py", "args": [{"flag": "--suite", "value": "libero_goal_swap", "kind": "value", "on": false, "desc": "LIBERO suite name."}, {"flag": "--task-id", "value": "8", "kind": "value", "on": false, "desc": "Task index within the suite (8 = put-the-bowl-on-the-plate)."}, {"flag": "--seed", "value": "51", "kind": "value", "on": false, "desc": "LIBERO seed (acceptance seeds 51-65; never a held-out seed 1-50 for anything other than reporting)."}, {"flag": "--n-frames", "value": "16", "kind": "value", "on": false, "desc": "Number of orbit waypoints."}, {"flag": "--camera", "value": "robot0_eye_in_hand", "kind": "value", "on": false, "desc": "Default is the fixed 'agentview' camera (teleported each frame). 'robot0_eye_in_hand' needs real arm motion first -- it is parented to the moving gripper, not world, so teleporting it directly is not yet implemented."}, {"flag": "--out-dir", "value": "../data/runs/mapper_probe/frames", "kind": "value", "on": false, "desc": "Where per-frame .npz files and manifest.txt are written."}], "description": "Teleports a LIBERO camera through N orbit waypoints around the scene and saves RGB-D + world-frame camera pose per frame, in the same convention cap_harness's LiberoAdapter uses for its own camera reads.", "examples": [{"title": "Default bowl-on-plate orbit scan (what produced the 2026-11-03 result)", "cmd": "cd ASPIRE && LIBERO_CONFIG_PATH=$PWD/.libero .venv-libero/bin/python ../tools/mapper_probe/scan_orbit.py"}], "modules": ["scene_recon", "aspire"], "in": [], "out": ["data/runs/mapper_probe/frames/*.npz", "data/runs/mapper_probe/frames/manifest.txt"], "cost": "free", "minutes": 1, "doc": "docs/perception/scene-reconstruction-probe.md"}, {"id": "scene_recon.scan_arm", "title": "Real arm-driven scan: sweep the Franka's wrist camera (not a teleport)", "group": "scene-recon", "runner": "libero", "base": "../tools/mapper_probe/scan_arm.py", "args": [{"flag": "--pan-offsets", "value": "-0.5 -0.25 0.0 0.25 0.5", "kind": "value", "on": false, "desc": "Radians added to the reset shoulder-pan joint per waypoint."}, {"flag": "--lift-offsets", "value": "-0.15 0.0 0.15", "kind": "value", "on": false, "desc": "Radians added to the reset shoulder-lift joint per waypoint; waypoints are the pan x lift grid."}, {"flag": "--out-dir", "value": "../data/runs/mapper_probe/frames_arm_full", "kind": "value", "on": false, "desc": "Where per-frame .npz files and manifest.txt are written."}], "description": "Closed-loop drives the Franka's shoulder-pan and shoulder-lift joints through a pan x lift waypoint grid using the exact delta-joint formula LiberoActionCodec.encode uses, then saves robot0_eye_in_hand RGB-D + world-frame camera pose per waypoint -- genuine robot motion, not a camera teleport.", "examples": [{"title": "Default 15-waypoint pan x tilt grid", "cmd": "cd ASPIRE && LIBERO_CONFIG_PATH=$PWD/.libero .venv-libero/bin/python ../tools/mapper_probe/scan_arm.py"}], "modules": ["scene_recon", "aspire"], "in": [], "out": ["data/runs/mapper_probe/frames_arm_full/*.npz", "data/runs/mapper_probe/frames_arm_full/manifest.txt"], "cost": "free", "minutes": 1, "doc": "docs/perception/scene-reconstruction-probe.md"}, {"id": "scene_recon.scan_lookat", "title": "IK look-at scan: fixate the bowl from arc viewpoints via PyRoki", "group": "scene-recon", "runner": "libero", "base": "../tools/mapper_probe/scan_lookat.py", "args": [{"flag": "--azimuths-deg", "value": "-60 -20 20 60", "kind": "value", "on": false, "desc": "Azimuths around the look-at target, 0 = behind the robot."}, {"flag": "--heights-m", "value": "0.35 0.55", "kind": "value", "on": false, "desc": "Camera heights above the target per azimuth."}, {"flag": "--out-dir", "value": "../data/runs/mapper_probe/frames_lookat", "kind": "value", "on": false, "desc": "Where per-frame .npz files and manifest.txt are written."}], "description": "Solves fixated camera poses with the PyRoki IK service (start it with supervise_services.sh --providers pyroki) and closed-loop drives the Franka there. Narrow reachable set: expect IK skips outside the az=-20 column.", "examples": [], "modules": ["scene_recon", "aspire"], "in": ["PyRoki IK service on 127.0.0.1:8116"], "out": ["data/runs/mapper_probe/frames_lookat/*.npz", "data/runs/mapper_probe/frames_lookat/manifest.txt"], "cost": "free", "minutes": 3, "doc": "docs/perception/scene-reconstruction-probe.md"}, {"id": "scene_recon.plan_esdf", "title": "Plan one motion against the fused mesh vs the single-frame mesh", "group": "scene-recon", "runner": "curobo", "base": "../tools/mapper_probe/plan_esdf.py", "args": [], "description": "Fuses the orbit frames into a Mapper ESDF mesh, plans home-to-pan-sweep with it as the cuRobo world obstacle, and repeats with the single-frame voxel mesh. Planning only, nothing executes.", "examples": [], "modules": ["scene_recon", "aspire"], "in": ["data/runs/mapper_probe/frames/*.npz"], "out": [], "cost": "free", "minutes": 3, "doc": "docs/perception/scene-reconstruction-probe.md"}, {"id": "scene_recon.viewer", "title": "Build the single-file HTML viewer for the fused meshes", "group": "scene-recon", "runner": "shell", "base": "uv run python tools/mapper_probe/make_viewer.py", "args": [], "description": "Embeds the fused-combined, orbit, full arm-scan and IK look-at PLYs as base64 in one portable HTML page (three.js orbit controls, mesh toggle, fused mesh shown by default). Open data/runs/mapper_probe/viewer.html straight from disk.", "examples": [], "modules": ["scene_recon"], "in": ["data/runs/mapper_probe/fused_combined/reconstructed_scene.ply", "data/runs/mapper_probe/reconstructed_scene.ply", "data/runs/mapper_probe/arm_scan_full/reconstructed_scene.ply", "data/runs/mapper_probe/lookat_scan/reconstructed_scene.ply"], "out": ["data/runs/mapper_probe/viewer.html"], "cost": "free", "minutes": 1, "doc": "docs/perception/scene-reconstruction-probe.md"}, {"id": "scene_recon.fuse", "title": "Fuse scan frames into a cuRobo Mapper mesh", "group": "scene-recon", "runner": "curobo", "base": "../tools/mapper_probe/fuse_mapper.py", "args": [{"flag": "--frames-dir", "value": "../data/runs/mapper_probe/frames", "kind": "value", "on": false, "desc": "One or more frame directories (space-separated), each with its own manifest.txt, fused into one Mapper. Output of scene_recon.scan / .scan_arm / .scan_lookat."}, {"flag": "--voxel-size", "value": "0.01", "kind": "value", "on": false, "desc": "TSDF voxel size in meters; smaller is sharper and slower."}, {"flag": "--n-render-views", "value": "3", "kind": "value", "on": false, "desc": "How many shaded PNG renders to save from scan camera poses."}], "description": "Integrates every saved frame from one or more scan directories into curobo.perception.Mapper (Warp backend), computes the ESDF, extracts a surface mesh, and saves it plus a few shaded renders. Multiple --frames-dir values fuse all their frames into a single denser mesh.", "examples": [{"title": "Default fuse on the orbit scan above", "cmd": "cd ASPIRE && .venv-curobo/bin/python ../tools/mapper_probe/fuse_mapper.py"}, {"title": "Fuse all three scans (orbit + arm pan-tilt + IK look-at) at a finer voxel size (logged 2026-11-04: 44,180 verts / 82,957 faces, vs 23,441/44,253 for the orbit scan alone)", "cmd": "cd ASPIRE && .venv-curobo/bin/python ../tools/mapper_probe/fuse_mapper.py --frames-dir ../data/runs/mapper_probe/frames ../data/runs/mapper_probe/frames_arm_full ../data/runs/mapper_probe/frames_lookat --out-dir ../data/runs/mapper_probe/fused_combined --voxel-size 0.008 --n-render-views 4"}, {"title": "Robot-free orbit-only mesh at 5 mm (input of plan_rack and the gate; logged 2026-11-04)", "cmd": "cd ASPIRE && .venv-curobo/bin/python ../tools/mapper_probe/fuse_mapper.py --frames-dir ../data/runs/mapper_probe/frames ../data/runs/mapper_probe/frames_orbit_r1 ../data/runs/mapper_probe/frames_orbit_r2 --out-dir ../data/runs/mapper_probe/fused_orbit_hires --voxel-size 0.005"}, {"title": "Orbit rings used above", "cmd": "cd ASPIRE && LIBERO_CONFIG_PATH=$PWD/.libero .venv-libero/bin/python ../tools/mapper_probe/scan_orbit.py --n-frames 32 --height 0.95 --out-dir ../data/runs/mapper_probe/frames_orbit_r1 && LIBERO_CONFIG_PATH=$PWD/.libero .venv-libero/bin/python ../tools/mapper_probe/scan_orbit.py --n-frames 32 --height 1.35 --radius 0.5 --out-dir ../data/runs/mapper_probe/frames_orbit_r2"}], "modules": ["scene_recon", "aspire"], "in": ["data/runs/mapper_probe/frames/*.npz"], "out": ["data/runs/mapper_probe/reconstructed_scene.ply", "data/runs/mapper_probe/reconstructed_view_*.png", "data/runs/mapper_probe/fused_combined/ (combined-fuse example output)"], "cost": "free", "minutes": 2, "doc": "docs/perception/scene-reconstruction-probe.md"}, {"id": "scene_recon.gate_truth", "title": "Sim-ready gate 1: ground truth of one LIBERO object", "group": "scene-recon", "runner": "libero", "base": "../tools/mapper_probe/gate_truth.py", "args": [{"flag": "--body", "value": "akita_black_bowl_1_main", "kind": "value", "on": false, "desc": "MuJoCo body name (e.g. wine_rack_1_main)."}, {"flag": "--out-dir", "value": "../data/runs/mapper_probe/gate", "kind": "value", "on": false, "desc": "Where truth.json and truth_vertices.npy go."}], "description": "Reads true mass, pose, world-frame visual-mesh vertices, robot base pose and reset joints from the simulator; the reference every later gate stage compares against.", "examples": [{"title": "Bowl (default)", "cmd": "cd ASPIRE && LIBERO_CONFIG_PATH=$PWD/.libero MUJOCO_GL=egl PYOPENGL_PLATFORM=egl EGL_PLATFORM=device .venv-libero/bin/python ../tools/mapper_probe/gate_truth.py"}, {"title": "Wine rack, for plan_rack", "cmd": "cd ASPIRE && LIBERO_CONFIG_PATH=$PWD/.libero MUJOCO_GL=egl PYOPENGL_PLATFORM=egl EGL_PLATFORM=device .venv-libero/bin/python ../tools/mapper_probe/gate_truth.py --body wine_rack_1_main --out-dir ../data/runs/mapper_probe/gate_rack"}], "modules": ["scene_recon", "aspire"], "in": [], "out": ["data/runs/mapper_probe/gate/truth.json", "data/runs/mapper_probe/gate/truth_vertices.npy"], "cost": "free", "minutes": 1, "doc": "docs/perception/scene-reconstruction-probe.md"}, {"id": "scene_recon.gate_extract", "title": "Sim-ready gate 2: crop an object from the fused mesh and check geometry", "group": "scene-recon", "runner": "curobo", "base": "../tools/mapper_probe/gate_extract.py", "args": [{"flag": "--mesh", "value": "../data/runs/mapper_probe/fused_hires/reconstructed_scene.ply", "kind": "value", "on": false, "desc": "Fused scene mesh (z-up world frame)."}, {"flag": "--tag", "value": "fused_hires", "kind": "value", "on": false, "desc": "Report name suffix."}, {"flag": "--scale", "value": "1.0", "kind": "value", "on": false, "desc": "Negative control: scale the crop (1.3 must fail)."}, {"flag": "--max-chamfer-mean-mm", "value": "5.0", "kind": "value", "on": false, "desc": "Fixed a priori, not tuned."}], "description": "Crops the object by its true box, keeps the largest component, and checks chamfer distance, bounding box, convex-hull volume and hull watertightness against ground truth. Writes gate_<tag>_report.json and the collision hull STLs.", "examples": [{"title": "Real run (logged 2026-11-04: geometry pass, chamfer mean 4.5 mm)", "cmd": "cd ASPIRE && .venv-curobo/bin/python ../tools/mapper_probe/gate_extract.py"}, {"title": "Negative control (must fail)", "cmd": "cd ASPIRE && .venv-curobo/bin/python ../tools/mapper_probe/gate_extract.py --scale 1.3 --tag neg_scale13"}], "modules": ["scene_recon", "aspire"], "in": ["data/runs/mapper_probe/gate/truth.json"], "out": ["data/runs/mapper_probe/gate/gate_<tag>_report.json", "data/runs/mapper_probe/gate/recon_hull_<tag>.stl"], "cost": "free", "minutes": 1, "doc": "docs/perception/scene-reconstruction-probe.md"}, {"id": "scene_recon.gate_settle", "title": "Sim-ready gate 3: MuJoCo drop and settle test", "group": "scene-recon", "runner": "libero", "base": "../tools/mapper_probe/gate_settle.py", "args": [{"flag": "--tag", "value": "fused_hires", "kind": "value", "on": false, "desc": "Which extract report to complete."}, {"flag": "--drop-height-m", "value": "0.03", "kind": "value", "on": false, "desc": "Drop height."}, {"flag": "--tilt-deg", "value": "10.0", "kind": "value", "on": false, "desc": "Second run starts tilted by this much."}], "description": "Drops the reconstructed collision hull and the ground-truth hull (control) in MuJoCo with the true mass, upright and tilted. Passes on rest height, speed, tilt and resting penetration; writes sim_ready into the report.", "examples": [{"title": "After gate_extract", "cmd": "cd ASPIRE && LIBERO_CONFIG_PATH=$PWD/.libero MUJOCO_GL=egl PYOPENGL_PLATFORM=egl EGL_PLATFORM=device .venv-libero/bin/python ../tools/mapper_probe/gate_settle.py"}], "modules": ["scene_recon", "aspire"], "in": ["data/runs/mapper_probe/gate/gate_<tag>_report.json"], "out": ["data/runs/mapper_probe/gate/gate_<tag>_report.json"], "cost": "free", "minutes": 1, "doc": "docs/perception/scene-reconstruction-probe.md"}, {"id": "scene_recon.plan_rack", "title": "Wine-rack planning: fused mesh vs ASPIRE single-frame carved cloud", "group": "scene-recon", "runner": "curobo", "base": "../tools/mapper_probe/plan_rack.py", "args": [{"flag": "--start", "value": "far_hover", "kind": "value", "on": false, "desc": "far_hover or near_contact (run one start per process; mesh swaps crash CUDA otherwise)."}, {"flag": "--near-above-m", "value": "0.03", "kind": "value", "on": false, "desc": "Start height above the logged contact for near_contact."}, {"flag": "--mesh", "value": "../data/runs/mapper_probe/fused_orbit_hires/reconstructed_scene.ply", "kind": "value", "on": false, "desc": "Robot-free fused mesh (orbit frames only)."}], "description": "Same cuRobo planner, same start and goals, four worlds (blind, fused, single-frame carved, single-frame uncarved) around the wine-rack incident of dev/curobo. Planning only, needs CUDA.", "examples": [{"title": "Far start", "cmd": "cd ASPIRE && .venv-curobo/bin/python ../tools/mapper_probe/plan_rack.py --start far_hover"}, {"title": "Near start (reproduces the carve bug)", "cmd": "cd ASPIRE && .venv-curobo/bin/python ../tools/mapper_probe/plan_rack.py --start near_contact --near-above-m 0.03"}], "modules": ["scene_recon", "aspire"], "in": ["data/runs/mapper_probe/gate_rack/truth.json", "data/runs/mapper_probe/fused_orbit_hires/reconstructed_scene.ply"], "out": ["data/runs/mapper_probe/plan_rack_<start>_<h>.json"], "cost": "free", "minutes": 3, "doc": "docs/perception/scene-reconstruction-probe.md"}, {"id": "curobo.replay", "title": "Replay logged programs with the held-bowl attach or an oracle cloud (no tokens)", "group": "experiments", "runner": "shell", "base": "ASPIRE/.venv-libero/bin/python dev/curobo/replay_attach.py", "args": [{"flag": "--mode", "value": "attach", "kind": "value", "on": true, "required": true, "choices": ["sparse", "attach", "oracle", "oracle-attach"], "desc": "sparse: no attach (single-frame carved cloud). attach: held bowl as spheres, written to the global data/runs/curobo/attach.json. oracle: bowl and plate pixels removed from the planning cloud with simulator segmentation (privileged upper bound). oracle-attach: both."}, {"flag": "--out", "value": "data/runs/curobo/replay", "kind": "value", "on": true, "required": true, "desc": "Output root; results go to <out>/<mode>/<label>/result.json."}, {"flag": "--only", "value": "exp10_nodemo_a1,exp10_nodemo_a2", "kind": "value", "on": false, "desc": "Comma-separated labels (see PROGRAMS in the script). Default: all seven."}, {"flag": "--seeds", "value": "51,52,53", "kind": "value", "on": false, "desc": "Comma-separated acceptance seeds (51 to 65 only; default 51). Output folders end in _s<seed>."}, {"flag": "--timeout-s", "value": "900", "kind": "value", "on": false, "desc": "Per-run wall clock."}], "description": "Costs no model tokens (GPU and simulator only). Needs the SAM 3 and PyRoki services and the dev cuRobo service on 8118 (services.start, curobo.service). Runs one program at a time and resets the global attach file before each run; never start two at once. Written 2026-11-04 for the cuRobo false-negative debugging (docs/synthesizer/handoff-curobo-debug.md). Every plan's goal is labelled against the simulator (planner.label_goals); score with curobo.goal-confusion. Do not run while another simulator is running.", "examples": [{"title": "Two programs, attach on", "cmd": "ASPIRE/.venv-libero/bin/python dev/curobo/replay_attach.py --mode attach --out data/runs/curobo/replay --only exp10_nodemo_a1,exp10_nodemo_a2"}, {"title": "Oracle upper bound", "cmd": "ASPIRE/.venv-libero/bin/python dev/curobo/replay_attach.py --mode oracle --out data/runs/curobo/replay_oracle --only exp10_nodemo_a1"}], "modules": ["launcher", "rollout", "aspire", "services"], "in": ["data/runs/curobo/exp10|exp11 program_attempt*.py"], "out": ["<out>/<mode>/<label>_s<seed>/result.json", "<out>/<mode>/<label>_s<seed>/goal_labels.jsonl"]}, {"id": "curobo.goal-confusion", "title": "Score cuRobo verdicts against the simulator (false negatives and positives)", "group": "experiments", "runner": "ants", "base": "dev/curobo/goal_confusion.py data/runs/curobo/replay_seeds/attach data/runs/curobo/replay_seeds/sparse", "args": [], "description": "Reads the goal labels from curobo.replay. A refused goal that has no forbidden contact in the simulator is a false negative. Goal state only, not the path. No tokens, no GPU.", "examples": [{"title": "Attach against sparse", "cmd": "uv run python dev/curobo/goal_confusion.py data/runs/curobo/replay_seeds/attach data/runs/curobo/replay_seeds/sparse"}], "modules": ["launcher"], "in": ["goal_labels.jsonl"], "out": ["stdout"]}]}</script>
<script>
(function(){
const D=JSON.parse(document.getElementById("data").textContent);
const EXP=Object.fromEntries(D.experiments.map(e=>[e.id,e]));
const MOD=Object.fromEntries(D.modules.map(m=>[m.id,m]));
const CMD=Object.fromEntries(D.commands.map(c=>[c.id,c]));
const state={}; // command id -> {on:{flag:bool}, val:{flag:string}}
let sel=null, selMod=null;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function href(p){
  if(!p||p.startsWith("..")) return null;
  if(/^https?:/.test(p)) return p;
  p=p.split(",")[0].trim();
  return location.protocol==="file:" ? "../"+p : D.repo_url+p;
}
const link=p=>{const h=href(p);return h?`<a href="${esc(h)}" target="_blank" rel="noopener">${esc(p)}</a>`:`<span class="mono">${esc(p)}</span>`};

// Same rules as ants.evalkit.runbook.command_text.
const SAFE=/^[A-Za-z0-9_@%+=:,.\/-]+$/;
const q=(v,raw)=>raw||SAFE.test(v)?v:"'"+v.replace(/'/g,"'\\''")+"'";
function st(c){return state[c.id]||(state[c.id]={on:Object.fromEntries(c.args.map(a=>[a.flag,a.on])),val:Object.fromEntries(c.args.map(a=>[a.flag,a.value||""]))})}
function text(c){
  const s=st(c),head=[],env=[],fl=[];
  if(c.where)head.push(c.where);
  if(c.env)env.push(c.env);
  for(const a of c.args){
    if(!s.on[a.flag])continue;
    const v=s.val[a.flag];
    if(a.kind==="env")env.push(a.flag+q(v));
    else if(a.kind==="switch")fl.push(a.flag);
    else fl.push(a.flag+" "+q(v,a.raw));
  }
  const main=[...env,D.runners[c.runner].prefix,c.base].filter(Boolean).join(" ");
  const body=[main,...fl].join(" \\\n    ");
  return head.length?[...head,body].join(" && "):body;
}

async function copy(btn,t){
  try{await navigator.clipboard.writeText(t);}
  catch{const r=document.createRange(),pre=btn.parentElement.querySelector("pre");r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);}
  const old=btn.textContent;btn.textContent="Copied";btn.classList.add("done");
  setTimeout(()=>{btn.textContent=old;btn.classList.remove("done")},1400);
}
const term=(t,id)=>`<div class="term"><pre${id?` id="${id}"`:""}>${esc(t)}</pre><button class="btn copy" type="button" data-copy="${id||""}">Copy</button></div>`;

/* ---------- architecture map ---------- */
const POS={hurobo:[0,0],demospec_tools:[1,0],generator:[2,0],llm:[3,0],muse:[4,0],
 libero_demos:[0,1],orch_exp:[1,1],diagnoser:[3,1],scene_world:[4,1],
 planner:[0,2],system2:[1,2],rollout:[2,2],launcher:[3,2],aspire:[4,2],
 evalkit:[1,3],contracts:[2,3],curobo_dev:[3,3],services:[4,3],radar:[0,3]};
const NW=168,NH=46,CX=196,RY=84;
const pos=id=>({x:10+POS[id][0]*CX,y:10+POS[id][1]*RY});
function map(e){
  const hit=new Set(e.modules);
  let s=`<svg viewBox="0 0 ${10+4*CX+NW+10} ${10+3*RY+NH+10}" role="img" aria-label="Module map; highlighted modules are used by this experiment"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--edge)"/></marker></defs>`;
  for(const [a,b] of D.flow){
    const pa=pos(a),pb=pos(b),on=hit.has(a)&&hit.has(b);
    s+=`<line class="edge ${on?"hit":hit.size?"dim":""}" x1="${pa.x+NW/2}" y1="${pa.y+NH/2}" x2="${pb.x+NW/2}" y2="${pb.y+NH/2}" marker-end="url(#ar)"/>`;
  }
  for(const m of D.modules){
    if(!POS[m.id])continue;const p=pos(m.id),on=hit.has(m.id);
    s+=`<g class="node ${on?"hit":hit.size?"dim":""} ${selMod===m.id?"sel":""}" data-mod="${m.id}" tabindex="0" role="button" aria-label="${esc(m.name)}"><rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="6"/><text x="${p.x+10}" y="${p.y+19}">${esc(m.name.length>27?m.name.slice(0,26)+"…":m.name)}</text><text class="sub" x="${p.x+10}" y="${p.y+35}">${esc(m.group)}</text></g>`;
  }
  return s+"</svg>";
}
function modPanel(){
  if(!selMod)return `<p class="note">Select a module to see its job, files, input and output. Highlighted modules are the ones this experiment touches.</p>`;
  const m=MOD[selMod];
  const users=D.experiments.filter(e=>e.modules.includes(m.id)).map(e=>`<button class="chip" data-exp="${e.id}">${esc(e.id)}</button>`).join("");
  return `<div class="mod"><strong>${esc(m.name)}</strong> <span class="pill">${esc(m.group)}</span>
   <dl><dt>Does</dt><dd>${esc(m.role)}</dd><dt>Files</dt><dd>${m.path.split(", ").map(link).join(", ")}</dd>
   <dt>Input</dt><dd>${esc(m.in.join("; ")||"none")}</dd><dt>Output</dt><dd>${esc(m.out.join("; ")||"none")}</dd>
   <dt>Doc</dt><dd>${link(m.doc)}</dd><dt>Used by</dt><dd><span class="chips">${users}</span></dd></dl></div>`;
}

/* ---------- commands ---------- */
function argRow(c,a,i){
  const s=st(c),id=`${c.id}-${i}`;
  const ck=`<input type="checkbox" id="${id}-on" data-cmd="${c.id}" data-flag="${esc(a.flag)}" ${s.on[a.flag]?"checked":""} ${a.required?"disabled checked":""} aria-label="Use ${esc(a.flag)}">`;
  let val="";
  if(a.kind!=="switch"){
    val=a.choices?`<select class="val" id="${id}-v" data-cmd="${c.id}" data-flag="${esc(a.flag)}">${[...new Set([a.value,...a.choices])].map(o=>`<option ${o===s.val[a.flag]?"selected":""}>${esc(o)}</option>`).join("")}</select>`
      :`<input class="val" type="text" id="${id}-v" data-cmd="${c.id}" data-flag="${esc(a.flag)}" value="${esc(s.val[a.flag])}" spellcheck="false">`;
  }else val=`<span class="note">switch</span>`;
  return `${ck}<label class="flag" for="${id}-on">${esc(a.flag)}${a.required?" *":""}</label><div>${val}</div><div class="desc">${esc(a.desc)}</div>`;
}
function cmdCard(c){
  const r=D.runners[c.runner];
  const ex=c.examples.length?`<details class="ex"><summary>${c.examples.length} example${c.examples.length>1?"s":""}</summary>${c.examples.map((x,i)=>`<p class="cap">${esc(x.title)}</p>${term(x.cmd,`ex-${c.id}-${i}`)}`).join("")}</details>`:"";
  const mods=c.modules.length?`<span class="chips">${c.modules.map(m=>`<button class="chip" data-mod="${m}">${esc(m)}</button>`).join("")}</span>`:"";
  return `<section class="card cmd" id="c-${c.id}" data-cmd="${c.id}">
   <header><div><h2>${esc(c.title)}</h2><span class="id">${esc(c.id)}</span></div>
   <div class="row">${c.paid?`<span class="pill paid">spends Muse tokens</span>`:`<span class="pill free">${esc(c.cost||"free")}</span>`}<span class="pill">~${c.minutes} min</span><span class="pill">${esc(r.label)}</span></div></header>
   <p>${esc(c.description)}</p>
   ${c.paid?`<div class="warn">Paid: ${esc(c.cost||"")}. Keep <code>--token-budget</code> small first, and ask before a big run.</div>`:""}
   ${c.args.length?`<div class="argwrap"><div class="args"><span class="h"></span><span class="h">Flag</span><span class="h">Value</span><span class="h">Meaning</span>${c.args.map((a,i)=>argRow(c,a,i)).join("")}</div></div>`:""}
   ${term(text(c),`out-${c.id}`)}
   ${ex}
   <div class="meta"><span>Reads: ${esc(c.in.join("; ")||"nothing")}</span><span>Writes: ${esc(c.out.join("; ")||"nothing")}</span>${c.doc?`<span>Doc: ${link(c.doc)}</span>`:""}</div>
   ${mods}</section>`;
}

/* ---------- views ---------- */
function rail(){
  const kinds=[["setup","Setup and prep"],["experiment","Experiments"],["tool","Tools"]];
  const k=e=>e.kind==="prep"?"setup":e.kind;
  let h=`<h2>Overview</h2><button data-exp="all" aria-current="${sel==="all"}">All commands<small>${D.commands.length} commands, grouped</small></button>`;
  for(const [key,label] of kinds){
    h+=`<h2>${label}</h2>`+D.experiments.filter(e=>k(e)===key).map(e=>`<button data-exp="${e.id}" aria-current="${sel===e.id}">${esc(e.title)}<small>${esc(e.status)}</small></button>`).join("");
  }
  $("#rail").innerHTML=h;
}
function expView(e){
  return `<section class="card"><div class="row" style="justify-content:space-between"><h2>${esc(e.title)}</h2><span class="pill st">${esc(e.status)}</span></div>
   <p style="margin:4px 0 10px">${esc(e.question)}</p>
   <div class="meta"><span>Docs: ${link(e.doc)}</span>${e.run_dir?`<span>Run dir: <code>${esc(e.run_dir)}</code></span>`:""}${e.cost?`<span>Cost: ${esc(e.cost)}</span>`:""}</div>
   <p class="note" style="margin:8px 0 0"><strong>Result so far:</strong> ${esc(e.result)}</p></section>
   <section class="card"><h3>Input, what runs, output</h3><div class="io">
    <div><strong>Input</strong><ul>${e.inputs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="mid"><strong>Commands, in order</strong><ul>${e.commands.map(c=>`<li><a href="#c-${c}" data-jump="${c}">${esc(CMD[c].title)}</a></li>`).join("")}</ul></div>
    <div><strong>Output</strong><ul>${e.outputs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div></section>
   <section class="card"><h3>Where it sits in the architecture</h3><div class="map" id="map">${map(e)}</div>
    <div class="legend"><span>Highlighted: used by this experiment</span><span>Arrows: data flow</span><span>Click a module</span></div>
    <div id="modpanel">${modPanel()}</div></section>
   ${e.commands.map(c=>cmdCard(CMD[c])).join("")}`;
}
function allView(filter){
  const f=filter.toLowerCase();
  const hits=D.commands.filter(c=>!f||[c.id,c.title,c.description,...c.args.map(a=>a.flag+" "+a.desc)].join(" ").toLowerCase().includes(f));
  const groups=[...new Set(hits.map(c=>c.group))];
  return `<section class="card"><h2>${f?`Commands matching “${esc(filter)}”`:"All commands"}</h2><p class="note" style="margin:0">${hits.length} of ${D.commands.length}. Pick an experiment on the left for the map and the commands in order.</p></section>`+
    (groups.map(g=>`<h3 style="margin:8px 0 0;color:var(--mute);font-size:12px;letter-spacing:.07em;text-transform:uppercase">${esc(g)}</h3>`+hits.filter(c=>c.group===g).map(cmdCard).join("")).join("")||`<section class="card">No command matches.</section>`);
}
function render(keepScroll){
  const y=scrollY;
  rail();
  $("#main").innerHTML=sel==="all"||!EXP[sel]?allView($("#q").value):expView(EXP[sel]);
  if(keepScroll)scrollTo(0,y);
}
function go(id){sel=id;selMod=null;try{history.replaceState(null,"","#"+id)}catch{location.hash=id}render();scrollTo(0,0)}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("button,a,.node");if(!t)return;
  if(t.dataset.exp){go(t.dataset.exp);return}
  if(t.dataset.mod&&t.closest("#map,.chips")){selMod=t.dataset.mod;if(sel==="all"){go(D.experiments.find(e=>e.modules.includes(selMod)).id);selMod=t.dataset.mod}
    const e=EXP[sel];$("#map").innerHTML=map(e);$("#modpanel").innerHTML=modPanel();$("#modpanel").scrollIntoView({block:"nearest"});return}
  if(t.dataset.jump){ev.preventDefault();$("#c-"+t.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(t.classList.contains("copy")){const pre=t.parentElement.querySelector("pre");copy(t,pre.textContent);}
});
document.addEventListener("keydown",ev=>{const n=ev.target.closest&&ev.target.closest(".node");if(n&&(ev.key==="Enter"||ev.key===" ")){ev.preventDefault();n.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
function upd(ev){
  const t=ev.target;if(!t.dataset||!t.dataset.cmd)return;
  const c=CMD[t.dataset.cmd],s=st(c),f=t.dataset.flag;
  if(t.type==="checkbox")s.on[f]=t.checked;
  else{s.val[f]=t.value;s.on[f]=true;const cb=t.closest(".args").querySelector(`input[type=checkbox][data-flag="${CSS.escape(f)}"]`);if(cb)cb.checked=true}
  $("#out-"+c.id).textContent=text(c);
}
document.addEventListener("input",upd);document.addEventListener("change",upd);
$("#q").addEventListener("input",()=>{if($("#q").value&&sel!=="all"){sel="all"}render(true)});
$("#sub").textContent=`${D.experiments.length} experiments, ${D.commands.length} commands, catalog of ${D.updated}. Pick an experiment, tune flags, copy the command.`;
const a=$("#arch");a.href=href("docs/images/architecture.svg");
const h=location.hash.slice(1);sel=EXP[h]?h:h==="all"?"all":"exp04";
render();
window.addEventListener("hashchange",()=>{const x=location.hash.slice(1);if(EXP[x]||x==="all"){sel=x;selMod=null;render()}});
})();
</script>
